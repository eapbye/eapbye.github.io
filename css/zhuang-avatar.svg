<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img"><style>
    :root {
      --bg-1: #fff4fb;
      --bg-2: #ffe2f1;
      --skin: #ffd9c9;
      --skin-2: #ffc5b2;
      --line: #342019;
      --hair: #4a2a1b;
      --hair-2: #8c4a2b;
      --hair-3: #23140f;
      --shirt: #ff55a6;
      --shirt-2: #f02e8f;
      --collar: #ffffff;
      --glasses: #7d6f6b;
      --eye: #2d1a13;
      --mouth: #b85855;
      --blush: #ff8aaa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, #fff 0 8%, transparent 9%),
        radial-gradient(circle at 20% 18%, #fff 0 2.5%, transparent 2.7%),
        radial-gradient(circle at 80% 28%, #fff 0 2%, transparent 2.2%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(92vw, 520px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 18px 24px rgba(79, 31, 53, .16));
    }

    .float { animation: float 3s ease-in-out infinite; transform-origin: center; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .line {
      stroke: var(--line);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thin-line {
      stroke: var(--line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .soft-line {
      stroke: rgba(52, 32, 25, .25);
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }

    .sparkle { animation: sparkle 1.8s ease-in-out infinite; transform-origin: center; }
    .sparkle.second { animation-delay: .8s; }
    @keyframes sparkle {
      0%, 100% { opacity: .55; transform: scale(.9); }
      50% { opacity: 1; transform: scale(1.18); }
    }
  </style>
      <defs>
        <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe7dc" />
          <stop offset="100%" stop-color="var(--skin)" />
        </linearGradient>

        <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--hair-2)" />
          <stop offset="48%" stop-color="var(--hair)" />
          <stop offset="100%" stop-color="var(--hair-3)" />
        </linearGradient>

        <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff7cbc" />
          <stop offset="100%" stop-color="var(--shirt-2)" />
        </linearGradient>

        <pattern id="shirtPattern" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M4 0 V20" stroke="rgba(255,255,255,.28)" stroke-width="3" />
          <path d="M0 8 H20" stroke="rgba(255,255,255,.12)" stroke-width="2" />
        </pattern>
      </defs>

      <g class="float">
        <ellipse cx="260" cy="462" rx="122" ry="26" fill="rgba(84, 42, 60, .12)" />

        <!-- 身體 -->
        <path class="line" d="M144 472 C150 362 190 326 260 326 C330 326 370 362 376 472 Z" fill="url(#shirtGrad)" />
        <path d="M150 470 C156 364 192 330 260 330 C328 330 364 364 370 470 Z" fill="url(#shirtPattern)" opacity=".85" />
        <path class="thin-line" d="M260 334 V472" stroke="rgba(52,32,25,.32)" fill="none" />
        <circle cx="260" cy="388" r="7" fill="#fff6fb" stroke="rgba(52,32,25,.35)" stroke-width="3" />
        <circle cx="260" cy="430" r="7" fill="#fff6fb" stroke="rgba(52,32,25,.35)" stroke-width="3" />

        <!-- 領口與脖子 -->
        <path class="line" d="M230 315 H290 V374 C280 386 240 386 230 374 Z" fill="var(--skin)" />
        <path class="line" d="M178 332 C206 326 235 334 260 365 C231 368 202 362 184 344 Z" fill="var(--collar)" />
        <path class="line" d="M342 332 C314 326 285 334 260 365 C289 368 318 362 336 344 Z" fill="var(--collar)" />

        <!-- 耳朵 -->
        <ellipse class="line" cx="143" cy="238" rx="28" ry="36" fill="var(--skin)" />
        <ellipse class="line" cx="377" cy="238" rx="28" ry="36" fill="var(--skin)" />
        <path class="soft-line" d="M139 232 C151 232 153 250 141 258" />
        <path class="soft-line" d="M381 232 C369 232 367 250 379 258" />

        <!-- 頭髮後層 -->
        <path class="line" d="M122 214 C118 122 174 64 260 66 C348 68 402 130 397 220 C395 290 348 335 260 335 C171 335 125 288 122 214 Z" fill="url(#hairGrad)" />

        <!-- 臉 -->
        <path class="line" d="M146 215 C146 138 192 94 260 94 C328 94 374 138 374 215 C374 300 328 350 260 350 C192 350 146 300 146 215 Z" fill="url(#skinGrad)" />
        <path d="M157 260 C173 316 211 343 260 343 C309 343 347 316 363 260 C348 325 311 357 260 357 C209 357 172 325 157 260 Z" fill="rgba(244, 155, 130, .16)" />

        <!-- 瀏海：用多片頭髮讓它更像人物 -->
        <path class="line" d="M135 205 C143 111 190 72 260 72 C214 82 177 116 153 178 C148 190 143 199 135 205 Z" fill="url(#hairGrad)" />
        <path class="line" d="M178 105 C214 76 271 70 312 88 C278 102 246 134 226 187 C213 154 194 128 178 105 Z" fill="url(#hairGrad)" />
        <path class="line" d="M255 80 C314 72 371 118 388 206 C363 193 341 164 326 116 C303 125 284 150 271 191 C260 150 258 111 255 80 Z" fill="url(#hairGrad)" />
        <path class="thin-line" d="M188 113 C174 137 164 163 158 194" stroke="rgba(255,255,255,.25)" fill="none" />
        <path class="thin-line" d="M310 100 C336 127 352 159 360 195" stroke="rgba(255,255,255,.20)" fill="none" />

        <!-- 臉部：眼鏡、眼睛、腮紅、嘴巴 -->
        <ellipse cx="214" cy="228" rx="19" ry="23" fill="var(--eye)" />
        <ellipse cx="306" cy="228" rx="19" ry="23" fill="var(--eye)" />
        <circle cx="207" cy="219" r="6" fill="white" />
        <circle cx="299" cy="219" r="6" fill="white" />
        <circle cx="221" cy="238" r="4" fill="rgba(255,255,255,.7)" />
        <circle cx="313" cy="238" r="4" fill="rgba(255,255,255,.7)" />

        <ellipse class="thin-line" cx="214" cy="228" rx="39" ry="28" fill="rgba(255,255,255,.12)" stroke="var(--glasses)" />
        <ellipse class="thin-line" cx="306" cy="228" rx="39" ry="28" fill="rgba(255,255,255,.12)" stroke="var(--glasses)" />
        <path class="thin-line" d="M253 227 H267" stroke="var(--glasses)" />
        <path class="thin-line" d="M175 222 L157 215" stroke="var(--glasses)" />
        <path class="thin-line" d="M345 222 L363 215" stroke="var(--glasses)" />

        <ellipse cx="185" cy="266" rx="22" ry="11" fill="var(--blush)" opacity=".42" />
        <ellipse cx="335" cy="266" rx="22" ry="11" fill="var(--blush)" opacity=".42" />
        <path class="soft-line" d="M259 241 C253 256 253 265 263 267" />
        <path d="M227 290 C244 312 277 312 294 290" fill="none" stroke="var(--mouth)" stroke-width="8" stroke-linecap="round" />
        <path d="M237 296 C251 306 270 306 283 296 C273 318 248 318 237 296 Z" fill="#ff9aaa" opacity=".75" />

        <!-- 可愛點綴 -->
        <path class="sparkle" d="M93 138 L104 164 L130 175 L104 186 L93 212 L82 186 L56 175 L82 164 Z" fill="#fff" opacity=".9" />
        <path class="sparkle second" d="M424 160 L432 178 L450 186 L432 194 L424 212 L416 194 L398 186 L416 178 Z" fill="#fff" opacity=".9" />
        <circle cx="407" cy="105" r="8" fill="#fff" opacity=".8" />
        <circle cx="114" cy="302" r="7" fill="#fff" opacity=".65" />
      </g>
    </svg>