# 推送到 main 後，自動把網站發佈到 GitHub Pages。
# 部署前先跑 tests/check_consistency.py，有 FAIL 就不會上線。
# 只會發佈下面 cp 列出的檔案；tests/、README.md、animation-preview.html 等不會上線。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Consistency and security checks
        run: python3 -B -I tests/check_consistency.py
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp course-registration.html _site/
          cp eap_nccu_background.svg _site/
          cp eap_nccu_v8_terminal.svg _site/
          cp -r css _site/css
          cp -r js _site/js
          cp -r data _site/data
          cp -r vendor _site/vendor
          cp -r documents _site/documents
          cp -r graduation _site/graduation
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
