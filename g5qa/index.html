<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>第5組 專題研討答詢快查</title>
<style>
:root{
  --ink:#20303a; --ink-soft:#4f5c65; --ink2:#45525b; --faint:#76818a;
  --paper:#f1efea; --card:#fffdf9; --line:#c4c8be; --line2:#d3dbe3; --sep:#efefea;
  --pri:#1d6fa5; --pri-soft:#e7eff6; --pri-line:#9fb9d0;
  --slate:#4d6a85; --slate-soft:#e9eef2; --slate-line:#b5c3d1;
  --navy:#2c4677; --navy-soft:#e8ecf4;
  --seal:#a23b3b; --seal-soft:#f6e9e7;
  --violet:#6c5a9e; --violet-soft:#efeaf6;
  --board:#e6ecf2; --zebra:#f4f7fa;
  --lift:0 1px 2px rgba(32,48,58,.07),0 3px 10px rgba(32,48,58,.05);
  --r-sm:7px; --r:11px; --r-lg:14px;
  --cn:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cn);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
.top{padding:4px 14px 2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:0 1px 0 var(--line2)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px}
.sbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:var(--r);font-family:var(--cn);font-size:15px;font-weight:700}
.sbtn svg{width:17px;height:17px}
.sbtn[hidden]{display:none}
.spanel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.spanel[hidden]{display:none}
.spanel .chips{grid-column:1 / -1}
.scancel{border:0;background:none;font-family:var(--cn);font-size:15px;color:var(--pri);padding:6px 2px}
em.amb{font-style:normal;font-size:11.5px;font-weight:700;color:var(--seal);background:var(--seal-soft);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.who-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-size:14px;font-weight:700;color:var(--violet)}
.who-h small{font-size:13px;font-weight:400;color:var(--ink-soft)}
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.people button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:50px;border:1px solid transparent;border-radius:var(--r);background:var(--card);box-shadow:var(--lift);font-family:var(--cn);font-size:15px;font-weight:700;color:var(--ink);padding:0}
.people button i{font-style:normal;font-size:11px;font-weight:400;color:var(--faint);line-height:1.1}
.people button.on{background:var(--violet);color:#fff;box-shadow:0 2px 8px rgba(108,90,158,.35)}
.people button.on i{color:rgba(255,255,255,.8)}
.title{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;padding-left:10px;border-left:4px solid var(--pri);line-height:26px}
.who-btn{display:flex;align-items:center;gap:4px;height:34px;border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:var(--r);padding:0 12px;font-size:15px;font-family:var(--cn)}
.who-btn b{font-weight:700}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;font-family:var(--cn);font-size:16px;color:var(--ink);padding:10px 38px 10px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);outline:none;-webkit-appearance:none}
.search input::placeholder{color:#a9b1ad}
.search input:focus{border-color:var(--pri)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;line-height:1;color:var(--faint);padding:4px 10px;display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px;padding:4px;background:var(--board);border-radius:var(--r)}
.tabs button{height:34px;border:0;border-radius:9px;background:transparent;font-family:var(--cn);font-size:15px;color:var(--ink-soft)}
.tabs button.on{background:var(--pri);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--cn)}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
main{padding:6px 12px calc(env(safe-area-inset-bottom) + 28px)}
.sec{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);margin:20px 2px 10px;padding-left:9px;border-left:4px solid var(--pri);line-height:22px}
.sec.amb{border-left-color:var(--seal)}
.sec small{font-size:13px;font-weight:400;color:var(--faint)}
.card{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);margin-bottom:10px;overflow:hidden}
.card.main::before,.card.help::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pri)}
.card.help::before{background:var(--slate-line)}
.q{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit}
.q .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--board);color:var(--ink-soft);font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.card.open .q .n{background:var(--pri);color:#fff}
.q .t{flex:1;font-weight:700;font-size:16px;line-height:1.5}
.role{flex:none;font-size:12px;border-radius:6px;padding:1px 7px;margin-top:2px;border:1px solid}
.role.main{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-line)}
.role.help{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.a{display:none;padding:0 14px 14px 48px}
.card.open .a{display:block}
.key{font-size:16px;font-weight:400;line-height:1.7;color:var(--ink);margin:0 0 8px;padding:9px 11px;background:var(--pri-soft);border-radius:var(--r-sm);border-left:3px solid var(--pri)}
.a ul{margin:0;padding-left:18px;color:var(--ink2)}
.a li{margin:4px 0;font-size:15px}
.a li::marker{color:var(--pri-line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--sep);align-items:center}
.pg{font-size:13px;font-weight:700;background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:2px 8px}
.ow{font-size:12.5px;color:var(--faint)}
mark{background:#fff0b3;color:inherit;padding:0 1px;border-radius:2px}
.tbl{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);overflow:hidden}
table{width:100%;border-collapse:collapse}
tr:nth-child(even){background:var(--zebra)}
td{padding:10px 12px;vertical-align:top;font-size:15px;color:var(--ink2)}
td.num{font-weight:700;color:var(--pri);white-space:nowrap;width:1%;font-size:16px}
td.p{white-space:nowrap;width:1%}
td.p span{font-size:12.5px;font-weight:700;background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:1px 7px}
.formula{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);padding:12px 14px;font-size:14.5px;color:var(--ink2);line-height:1.7}
.formula b{color:var(--pri);font-size:16px}
.formula div+div{margin-top:6px;padding-top:6px;border-top:1px solid var(--sep)}
.empty{color:var(--faint);text-align:center;padding:40px 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--faint);margin:12px 4px 0}
.legend i{display:inline-block;width:4px;height:13px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(32,48,58,.38);display:none;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:var(--paper);width:100%;border-radius:18px 18px 0 0;padding:18px 14px calc(env(safe-area-inset-bottom) + 18px)}
.panel h2{font-size:17px;margin:0 0 4px;padding-left:9px;border-left:4px solid var(--violet);line-height:22px}
.panel p{margin:6px 0 12px;font-size:13.5px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{border:1px solid transparent;background:var(--card);box-shadow:var(--lift);border-radius:var(--r);padding:10px 6px;font-size:15px;font-family:var(--cn);color:var(--ink);text-align:center}
.grid button small{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.grid button.on{border-color:var(--violet);background:var(--violet-soft);color:var(--violet);font-weight:700}
.foot{font-size:12.5px;color:var(--faint);text-align:center;margin:22px 0 0}
.hl{color:var(--pri);font-weight:700}
.key .hl{color:#155a88}
.sync{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 4px 0;font-size:12.5px;color:var(--faint)}
.sync a{color:var(--violet);text-decoration:none;font-weight:700;border:1px solid var(--violet);background:var(--violet-soft);border-radius:var(--r-sm);padding:2px 9px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pri);margin-right:5px;vertical-align:1px}
.sync .dot.off{background:var(--faint)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>第5組　答詢快查</h1>
    <button class="sbtn" id="sbtn" aria-label="搜尋"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>搜尋</span></button>
  </div>
  <div class="spanel" id="spanel" hidden>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="打關鍵字，或點下面的常用詞" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clr" aria-label="清除">×</button>
    </div>
    <button class="scancel" id="scancel">取消</button>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tabs" id="nav"><button data-v="all" class="on">全部</button><button data-v="core">核心</button><button data-v="ambush">防突襲</button><button data-v="nums">數字</button></div>
</header>
<div class="top">
  <div class="who-h">我是誰<small id="whoHint">選自己，只看全體適用和你負責的題目</small></div>
  <div class="people" id="people"></div>
</div>

<main id="main"></main>

      p:(r["頁碼"]||"").trim(), m: (m==="全員"||m==="")?"all":splitNames(m), h:splitNames(r["協答"]), kw:r["搜尋關鍵字"]||"" };
  });
}
function parseCSV(t){
  const out=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);out.push(row);row=[];f="";} else if(c!=='\r') f+=c; }
  if(f!==""||row.length){row.push(f);out.push(row);}
  const h=out.shift()||[]; return out.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]||""])));
}
function stamp(){ const d=new Date(); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function loadLocal(){
  try{ const c=JSON.parse(localStorage.getItem("g5qa_cache")||"null"); if(c&&c.rows&&c.rows.length){ CARDS=toCards(c.rows); SRC={mode:"cache",at:c.at}; return true; } }catch(e){}
  return false;
}
async function loadSheet(){
  for(const u of CSV_URLS){
    try{
      const r=await fetch(u+"&_="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const rows=parseCSV(await r.text());
      if(!rows.length || !("題目" in rows[0])) continue;
      CARDS=toCards(rows); SRC={mode:"live",at:stamp()};
      try{ localStorage.setItem("g5qa_cache",JSON.stringify({rows,at:SRC.at})); }catch(e){}
      render(); return;
    }catch(e){}
  }
  if(CSV_URLS.length){ SRC.fail=true; render(); }
}
// ---- view ----
let state={view:"all",who:"all",q:""};
try{ const s=JSON.parse(localStorage.getItem("g5qa")||"{}"); if(s.who) state.who=s.who; }catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf=id=>(PEOPLE.find(p=>p.id===id)||{}).name||id;
function fmt(text){
  let t=esc(text);
  t=t.replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>');
  if(state.q){ const q=esc(state.q); t=t.split(/(<[^>]+>)/).map(seg=>seg.startsWith("<")?seg:seg.split(q).join("<mark>"+q+"</mark>")).join(""); }
  return t;
}
function roleOf(c){
  if(c.m==="all") return "all";
  if(state.who==="all"||PRESENTERS.includes(state.who)) return null;
  if(c.m.includes(state.who)) return "main";
  if(c.h.includes(state.who)) return "help";
  return "none";
}
function match(c){
  if(!state.q) return true;
  const hay=(c.q+c.k+c.b.join("")+c.kw+c.p).replace(/\*/g,"").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function cardHTML(c){
  const r=roleOf(c);
  const owners=c.m==="all"?"全員":"主答 "+c.m.map(nameOf).join("、")+(c.h.length?"｜協答 "+c.h.map(nameOf).join("、"):"");
  const tag=r==="main"?'<span class="role main">主答</span>':r==="help"?'<span class="role help">協答</span>':"";
  return `<div class="card ${r==="main"?"main":r==="help"?"help":""}${state.q?" open":""}">
    <button class="q"><span class="n">${esc(c.id)}</span><span class="t">${c.amb?'<em class="amb">突襲</em>':''}${fmt(c.q)}</span>${tag}</button>
    <div class="a">
      ${c.k?`<p class="key">${fmt(c.k)}</p>`:""}
      ${c.b.length?"<ul>"+c.b.map(x=>"<li>"+fmt(x)+"</li>").join("")+"</ul>":""}
      <div class="meta">${c.p?`<span class="pg">${esc(c.p)}</span>`:""}<span class="ow">${esc(owners)}</span></div>
    </div></div>`;
}
function syncHTML(){
  if(!SHEET_ID) return "";
  const txt = SRC.mode==="live" ? `<span><i class="dot"></i>已同步　${SRC.at}</span>` :
              SRC.mode==="cache" ? `<span><i class="dot off"></i>${SRC.fail?"離線，":""}上次同步　${SRC.at}</span>` :
              `<span><i class="dot off"></i>${SRC.fail?"讀不到試算表，用內建版":"同步中…"}</span>`;
  return `<div class="sync">${txt}<a href="${EDIT_URL}" target="_blank" rel="noopener">編修擬答</a></div>`;
}
function numTable(list){ return '<div class="tbl"><table>'+list.map(n=>`<tr><td class="num">${n[0]}</td><td>${n[1]}</td><td class="p"><span>${n[2]}</span></td></tr>`).join("")+'</table></div>'; }
function render(){
  const m=$("#main"); drawPeople();
  if(state.view==="nums"&&!state.q){
    m.innerHTML=`<div class="sec">決策矩陣算式</div>
      <div class="formula"><div>方案二　3.50×0.25＋3.63×0.15＋3.75×0.1＋3.63×0.25＋3.25×0.15＋2.63×0.1＝<b>3.45</b></div><div>方案一　3.25×0.25＋2.00×0.15＋1.88×0.1＋3.00×0.25＋3.13×0.15＋4.38×0.1＝<b>2.96</b></div></div>
      <div class="sec">數字速查</div>${numTable(NUMS)}<p class="foot">頁碼依報告目次，請以紙本核對</p>`;
    return;
  }
  const list=CARDS.filter(c=>{
    if(state.view==="core"&&c.amb) return false;
    if(state.view==="ambush"&&!c.amb) return false;
    if(roleOf(c)==="none") return false;
    return match(c);
  });
  const numHits=state.q?NUMS.filter(n=>n.join("").toLowerCase().includes(state.q.toLowerCase())):[];
  let html=syncHTML();
  if(!list.length&&!numHits.length){ m.innerHTML=html+'<p class="empty">沒有對應的題目，換個關鍵字試試</p>'; return; }
  if(state.who!=="all"&&!PRESENTERS.includes(state.who)) html+='<div class="legend"><span><i style="background:var(--pri)"></i>你主答</span><span><i style="background:var(--slate-line)"></i>你協答</span></div>';
  else if(PRESENTERS.includes(state.who)) html+='<div class="legend">報告人：顯示全部卡片</div>';
  let g="";
  list.forEach(c=>{ if(c.g!==g){ g=c.g; const n=list.filter(x=>x.g===g).length; html+=`<div class="sec">${esc(g)}<small>${n} 題</small></div>`; } html+=cardHTML(c); });
  if(numHits.length) html+='<div class="sec">數字</div>'+numTable(numHits);
  html+='<p class="foot">頁碼依報告目次，請以紙本核對</p>';
  m.innerHTML=html;
}
// ---- events ----
$("#main").addEventListener("click",e=>{ const b=e.target.closest(".q"); if(b) b.parentElement.classList.toggle("open"); });
$("#q").addEventListener("input",e=>{ state.q=e.target.value.trim(); $("#clr").style.display=state.q?"block":"none";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.textContent===state.q)); render(); });
function openSearch(){ $("#spanel").hidden=false; $("#sbtn").hidden=true; setTimeout(()=>$("#q").focus(),30); }
function closeSearch(){ $("#q").value=""; $("#q").dispatchEvent(new Event("input")); $("#spanel").hidden=true; $("#sbtn").hidden=false; }
$("#sbtn").onclick=openSearch; $("#scancel").onclick=closeSearch;
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") e.target.blur(); });
$("#clr").onclick=()=>{ $("#q").value=""; $("#q").dispatchEvent(new Event("input")); };
$("#chips").innerHTML=CHIPS.map(c=>`<button class="chip">${c}</button>`).join("");
$("#chips").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  $("#q").value=state.q===c.textContent?"":c.textContent; $("#q").dispatchEvent(new Event("input")); $("#q").blur(); window.scrollTo(0,0); });
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.view=b.dataset.v;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  if(state.q||!$("#spanel").hidden) closeSearch();
  render(); window.scrollTo(0,0); });
function counts(id){ let mm=0,hh=0; CARDS.forEach(c=>{ if(c.m!=="all"){ if(c.m.includes(id)) mm++; else if(c.h.includes(id)) hh++; } }); return [mm,hh]; }
function drawPeople(){
  $("#people").innerHTML=PEOPLE.map(p=>`<button data-id="${p.id}" class="${p.id===state.who?"on":""}">${p.id==="all"?"":`<i>${p.id}</i>`}${p.short}</button>`).join("");
  const p=PEOPLE.find(x=>x.id===state.who)||PEOPLE[0];
  let hint;
  if(p.id==="all") hint="選自己，只看全體適用和你負責的題目";
  else if(PRESENTERS.includes(p.id)) hint=`${p.name}｜報告人，顯示全部題目`;
  else { const [mm,hh]=counts(p.id); hint=`${p.name}｜${p.note}・主答 ${mm} 題、協答 ${hh} 題`; }
  $("#whoHint").textContent=hint;
}
$("#people").addEventListener("click",e=>{ const b=e.target.closest("button[data-id]"); if(!b) return;
  state.who=b.dataset.id; try{localStorage.setItem("g5qa",JSON.stringify({who:state.who}))}catch(err){} render();
  b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); });

if(!(SHEET_ID && loadLocal())){ CARDS=toCards(EMBED); }
render();
loadSheet();
</script>
</body>
