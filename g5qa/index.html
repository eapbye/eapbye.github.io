<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>第5組 專題研討答詢快查</title>
<style>
:root{
  --ink:#20303a; --ink-soft:#4f5c65; --ink2:#45525b; --faint:#76818a;
  --paper:#f1efea; --card:#fffdf9; --line:#c4c8be; --line2:#d3dbe3; --sep:#efefea;
  --pri:#1d6fa5; --pri-soft:#e7eff6; --pri-line:#9fb9d0;
  --slate:#4d6a85; --slate-soft:#e9eef2; --slate-line:#b5c3d1;
  --navy:#2c4677; --navy-soft:#e8ecf4;
  --seal:#a23b3b; --seal-soft:#f6e9e7;
  --violet:#6c5a9e; --violet-soft:#efeaf6;
  --board:#e6ecf2; --zebra:#f4f7fa;
  --lift:0 1px 2px rgba(32,48,58,.07),0 3px 10px rgba(32,48,58,.05);
  --r-sm:7px; --r:11px; --r-lg:14px;
  --cn:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cn);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
.top{padding:12px 14px 2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:0 1px 0 var(--line2)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px}
.sbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:var(--r);font-family:var(--cn);font-size:15px;font-weight:700}
.sbtn svg{width:17px;height:17px}
.sbtn[hidden]{display:none}
.spanel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.spanel[hidden]{display:none}
.spanel .chips{grid-column:1 / -1}
.scancel{border:0;background:none;font-family:var(--cn);font-size:15px;color:var(--pri);padding:6px 2px}
em.amb{font-style:normal;font-size:11.5px;font-weight:700;color:var(--seal);background:var(--seal-soft);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.who-h{margin:12px 2px 8px;line-height:1.3}
.who-h small{font-size:13px;font-weight:400;color:var(--ink-soft)}
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.people button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:50px;border:1px solid transparent;border-radius:var(--r);background:var(--card);box-shadow:var(--lift);font-family:var(--cn);font-size:15px;font-weight:700;color:var(--ink);padding:0}
.people button i{font-style:normal;font-size:11px;font-weight:400;color:var(--faint);line-height:1.1}
.people button.on{background:var(--violet);color:#fff;box-shadow:0 2px 8px rgba(108,90,158,.35)}
.people button.on i{color:rgba(255,255,255,.8)}
.title{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;padding-left:10px;border-left:4px solid var(--pri);line-height:26px}
.who-btn{display:flex;align-items:center;gap:4px;height:34px;border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:var(--r);padding:0 12px;font-size:15px;font-family:var(--cn)}
.who-btn b{font-weight:700}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;font-family:var(--cn);font-size:16px;color:var(--ink);padding:10px 38px 10px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);outline:none;-webkit-appearance:none}
.search input::placeholder{color:#a9b1ad}
.search input:focus{border-color:var(--pri)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;line-height:1;color:var(--faint);padding:4px 10px;display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px;padding:4px;background:var(--board);border-radius:var(--r)}
.tabs button{height:34px;border:0;border-radius:9px;background:transparent;font-family:var(--cn);font-size:15px;color:var(--ink-soft)}
.tabs button.on{background:var(--pri);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--cn)}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
main{padding:6px 12px calc(env(safe-area-inset-bottom) + 28px)}
.sec{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);margin:20px 2px 10px;padding-left:9px;border-left:4px solid var(--pri);line-height:22px}
.sec.amb{border-left-color:var(--seal)}
.sec small{font-size:13px;font-weight:400;color:var(--faint)}
.card{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);margin-bottom:10px;overflow:hidden}
.card.main::before,.card.help::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pri)}
.card.help::before{background:var(--slate-line)}
.q{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit}
.q .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--board);color:var(--ink-soft);font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.card.open .q .n{background:var(--pri);color:#fff}
.q .t{flex:1;font-weight:700;font-size:16px;line-height:1.5}
.role{flex:none;font-size:12px;border-radius:6px;padding:1px 7px;margin-top:2px;border:1px solid}
.role.main{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-line)}
.role.help{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.a{display:none;padding:0 14px 14px}
.card.open .a{display:block}
.key{font-size:16px;font-weight:400;line-height:1.7;color:var(--ink);margin:0 0 8px;padding:9px 11px;background:var(--pri-soft);border-radius:var(--r-sm);border-left:3px solid var(--pri)}
.a ul{margin:0;padding-left:18px;color:var(--ink2)}
.a li{margin:4px 0;font-size:15px}
.a li::marker{color:var(--pri-line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--sep);align-items:center}
.pg{font-size:13px;font-weight:700;background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:2px 8px}
.ow{font-size:12.5px;color:var(--faint)}
mark{background:#fff0b3;color:inherit;padding:0 1px;border-radius:2px}
.tbl{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);overflow:hidden}
table{width:100%;border-collapse:collapse}
tr:nth-child(even){background:var(--zebra)}
td{padding:10px 12px;vertical-align:top;font-size:15px;color:var(--ink2)}
td.num{font-weight:700;color:var(--pri);white-space:nowrap;width:1%;font-size:16px}
td.p{white-space:nowrap;width:1%}
td.p span{font-size:12.5px;font-weight:700;background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:1px 7px}
.formula{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);padding:12px 14px;font-size:14.5px;color:var(--ink2);line-height:1.7}
.formula b{color:var(--pri);font-size:16px}
.formula div+div{margin-top:6px;padding-top:6px;border-top:1px solid var(--sep)}
.empty{color:var(--faint);text-align:center;padding:40px 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--faint);margin:12px 4px 0}
.legend i{display:inline-block;width:4px;height:13px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(32,48,58,.38);display:none;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:var(--paper);width:100%;border-radius:18px 18px 0 0;padding:18px 14px calc(env(safe-area-inset-bottom) + 18px)}
.panel h2{font-size:17px;margin:0 0 4px;padding-left:9px;border-left:4px solid var(--violet);line-height:22px}
.panel p{margin:6px 0 12px;font-size:13.5px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{border:1px solid transparent;background:var(--card);box-shadow:var(--lift);border-radius:var(--r);padding:10px 6px;font-size:15px;font-family:var(--cn);color:var(--ink);text-align:center}
.grid button small{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.grid button.on{border-color:var(--violet);background:var(--violet-soft);color:var(--violet);font-weight:700}
.foot{font-size:12.5px;color:var(--faint);text-align:center;margin:22px 0 0}
.hl{color:var(--pri);font-weight:700}
.key .hl{color:#155a88}
.sync{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 4px 0;font-size:12.5px;color:var(--faint)}
.sync a{color:var(--violet);text-decoration:none;font-weight:700;border:1px solid var(--violet);background:var(--violet-soft);border-radius:var(--r-sm);padding:2px 9px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pri);margin-right:5px;vertical-align:1px}
.sync .dot.off{background:var(--faint)}
.seg{display:flex;gap:6px;margin-top:8px}
.sg{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:4px 14px;font-size:14px;font-family:var(--cn)}
.sg.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.note{background:var(--seal-soft);border-left:4px solid var(--seal);border-radius:var(--r-sm);padding:9px 12px;margin:10px 2px 0;font-size:14px;line-height:1.65;color:var(--ink2)}
.note b{color:var(--seal)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px;font-size:13px;font-weight:400;color:var(--faint);line-height:1.5}
.sub .star{font-weight:700;color:var(--navy)}
.pri{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.pri i{display:inline-block;width:8px;height:8px;border-radius:50%}
.pri.hi i{background:var(--seal)} .pri.mid i{background:#b58a2b} .pri.lo i{background:var(--slate-line)}
.pri.hi{color:var(--seal)} .pri.mid{color:#8a6a1f} .pri.lo{color:var(--slate)}
.lab{display:block;font-size:13px;font-weight:700;color:var(--pri);margin-bottom:3px}
.mem{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin:0 0 12px}
.mem span{background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:2px 9px;font-size:14.5px}
.mem b{color:var(--faint);font-weight:400;font-size:13px}
.blk{margin:0 0 12px}
.blk h4{margin:0 0 3px;font-size:13px;font-weight:700;color:var(--slate)}
.blk p{margin:0;font-size:15px;line-height:1.8;color:var(--ink2)}
.view{margin:0 0 8px;padding:9px 11px;background:var(--slate-soft);border-radius:var(--r-sm);font-size:14.5px;line-height:1.65;color:var(--ink2)}
.view .vh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--slate);margin-bottom:2px}
.view small{display:block;margin-top:4px;font-size:13px;color:var(--faint)}
.warn{margin:0 0 8px;padding:9px 11px;background:var(--seal-soft);border-radius:var(--r-sm);font-size:14.5px;line-height:1.65;color:var(--ink2)}
.orig{font-size:13px;color:var(--faint);margin:10px 0 0;line-height:1.6}
.lnk{font-size:13px;font-weight:700;color:var(--violet);text-decoration:none;border:1px solid var(--violet);background:var(--violet-soft);border-radius:var(--r-sm);padding:1px 8px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>第5組　答詢快查</h1>
    <button class="sbtn" id="sbtn" aria-label="搜尋"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>搜尋</span></button>
  </div>
  <div class="spanel" id="spanel" hidden>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="打關鍵字，或點下面的常用詞" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clr" aria-label="清除">×</button>
    </div>
    <button class="scancel" id="scancel">取消</button>
    <div class="chips" id="chips"></div>
  </div>
</header>
<div class="top">
  <div class="people" id="people"></div>
  <div class="seg" id="seg"></div>
</div>

<main id="main"></main>



<script>
// ---- config ----
// 擬答 v2（33題）已內建。共編表仍是舊版30題欄位，暫不同步；表改成 v2 欄位後，把下行填回 1mVG5XseQLABx_MprO5lab3Ts1Y_ho36Bds1YxPKOs2Y 即恢復同步
const SHEET_ID = "";           // Google Sheet id; empty = embedded data only
const EDIT_URL = SHEET_ID ? "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit" : "";
const SHEET_GID = "19939320";

const EMBED = [{"編號": "1", "分類": "核心立場", "必備核心": "是", "題目": "請用一句話說明你們的核心建議", "15秒簡答": "本組主張以教練陪跑，協助長照機構把數位工具真正用起來、持續用下去。", "記憶關鍵字": "數位工具 → 真正會用 → 教練陪跑 → 持續使用", "口語詳答": "本組的核心建議是，長照數位轉型不能只停留在採購系統。真正重要的是第一線人員能否順利操作、行政工作能否減輕，以及遇到問題時有沒有持續支援。因此，本組提出「轉型教練陪跑模式」，從需求盤點、分級培訓到後續追蹤，讓數位科技成為照護工作的助力，而不只是多一套設備。", "追問補充": "回應時先點出「使用效益」而非「採購數量」；若老師要求具體作法，再接需求盤點、分級教學與持續追蹤。", "教授優先": "中", "教授視角": "用一句話指出研究發現和方案的因果連結。", "教授理由": "驗收研究主軸是否聚焦，通常作為開場或收尾。", "長官優先": "中", "長官視角": "以一句話說明方案能帶給機構的具體改變。", "長官理由": "長官可能要求迅速說出政策效益與民眾受益。", "原始問法": "一句話說本報告的建議", "資料提醒": "", "核對連結": "", "頁碼": "摘要、結語 p.15", "主答": "全員", "搜尋關鍵字": "結論 總結 一句話 核心 建議 重點 困難"}, {"編號": "2", "分類": "核心立場", "必備核心": "", "題目": "為什麼挑選長照產業研究？", "15秒簡答": "本組選擇長照，是因應超高齡社會與照護人力壓力，希望先減少重複性行政工作。", "記憶關鍵字": "超高齡 → 人力不足 → 行政負擔 → 科技減負", "口語詳答": "本組選擇長照產業作為研究對象，主要考量臺灣進入超高齡社會後，長照服務需求增加，但機構仍面臨人力不足與行政負擔。照護人員除了照顧長者，往往也要處理排班、服務紀錄與核銷。以這次基礎訓練的專題立場，本組認為，政府若能協助機構先改善這些重複作業，就有機會讓人力更專注於照護服務，也符合長照3.0推動智慧照顧的政策方向。", "追問補充": "書面報告引用2026年長照服務需求突破90萬人及機構逾4,000家等數據；回答時可說「依報告引用資料」，避免推論所有機構都屬中小微企業。", "教授優先": "中", "教授視角": "選長照而非餐飲或其他中小微產業，有何研究依據？", "教授理由": "檢視研究標的選擇是否有理據與明確界線。", "長官優先": "中", "長官視角": "哪些類型、規模與區域的長照機構最需要優先輔導？", "長官理由": "長官重視服務需求與政策資源投放的對象。", "原始問法": "為什麼選長照？", "資料提醒": "", "核對連結": "", "頁碼": "p.1–2", "主答": "全員", "搜尋關鍵字": "選題 動機 長照 原因 超高齡 長照3.0 十年計畫"}, {"編號": "3", "分類": "核心立場", "必備核心": "", "題目": "為什麼需要政府協助，不能由長照機構自行採購？", "15秒簡答": "本組認為政府可協助縮小資訊落差，不是替所有機構買系統，而是提供盤點、媒合與輔導。", "記憶關鍵字": "資訊落差 → 避免錯買 → 需求媒合 → 政府輔導", "口語詳答": "本組認為，長照機構當然可以自行選購系統，但部分中小型機構欠缺資訊專業人員，未必能判斷工具是否符合照護流程，也不容易掌握後續維護成本。從公共政策角度，政府可以協助建立需求診斷、工具資訊及專業媒合機制，降低選錯系統或使用不順的風險。這不是主張政府包辦採購，而是讓有限公共資源更有效地支持長照服務。", "追問補充": "避免說「政府一定有責任替機構買單」；宜聚焦政策介入的公共利益、資訊落差及協助機制。", "教授優先": "中", "教授視角": "政府介入這個市場問題的理論與政策必要性是什麼？", "教授理由": "關乎公共介入正當性，但不是本報告評選工具核心。", "長官優先": "高", "長官視角": "政府為何要做，與民間資訊服務業者如何分工？", "長官理由": "會牽涉公帑投入、政府角色界線與民間市場分工。", "原始問法": "政府為什麼要介入？機構自己買系統不行嗎？", "資料提醒": "", "核對連結": "", "頁碼": "p.1–3", "主答": "全員", "搜尋關鍵字": "政府 介入 正當性 公共問題 為什麼 自己買 市場"}, {"編號": "4", "分類": "研究與證據", "必備核心": "", "題目": "沒有正式訪談、以次級資料為主，研究限制與可信度怎麼交代？", "15秒簡答": "本組主要依文獻與次級資料分析，並參考非正式案例分享；未做正式訪談，是研究限制。", "記憶關鍵字": "文獻資料 → 非正式案例 → 無正式訪談 → 試辦再驗證", "口語詳答": "本組這次主要使用衛福部、資策會等資料，以及研究文獻和產業報導進行分析，也參考了立心基金會相關員工的非正式經驗分享。不過，本組沒有完成正式且具代表性的機構訪談，因此只能提出可能的共通問題，不能說已驗證所有長照機構都是如此。另外，決策矩陣由組員評分，經費也尚未精算。若未來真正試辦，應先蒐集不同機構與資服業者的意見，再修正方案。", "追問補充": "三項主要限制：正式訪談不足、決策矩陣由組員評分、經費及教練人力尚未細算。來源資料可輔助判斷，但不宜宣稱「已經證實因果」。", "教授優先": "高", "教授視角": "沒有正式訪談，如何確認魚骨圖問題是產業共通痛點？", "教授理由": "方法論、樣本限制與論證強度是教授典型追問。", "長官優先": "中", "長官視角": "試辦前會如何補齊需求調查、風險和實地訪查？", "長官理由": "實務會在計畫設計階段要求需求證據，但不一定深究研究方法。", "原始問法": "本報告有什麼限制？有沒有實際訪談？ ／ 你們的資料很多來自次級資料，如何確保是長照產業的痛點？", "資料提醒": "立心內容是非正式經驗分享，不能寫成有正式訪談樣本。", "核對連結": "https://docs.google.com/spreadsheets/d/1mVG5XseQLABx_MprO5lab3Ts1Y_ho36Bds1YxPKOs2Y/edit?gid=1721214542#gid=1721214542", "頁碼": "參考資料 p.16、附件2", "主答": "全員", "搜尋關鍵字": "限制 不足 訪談 實地 二手資料 調查 立心 缺點"}, {"編號": "5", "分類": "政策與對象", "必備核心": "是", "題目": "臺灣雲市集是什麼？與長照現場有什麼落差？", "15秒簡答": "本組借鏡雲市集過去的工具媒合經驗；長照仍需照護流程、資安與持續教學配套。", "記憶關鍵字": "雲市集媒合 → 通用工具 → 長照特殊需求 → 持續教學", "口語詳答": "本組研究的臺灣雲市集，是政府過去整合雲端工具與資服業者的政策案例，也曾提供數位點數補助。但長照的工作不只有一般辦公行政，還涉及照護紀錄、個資保護及系統間資料整合。即使平台有適合的軟體，機構仍可能面臨不會操作或欠缺技術支援的問題。因此，本組希望從這項政策經驗出發，補強需求診斷、實務教學與後續維運，而不是單純增加採購。", "追問補充": "舊有1:1數位點數補助的作業要點已於115年8月18日廢止，回答時必須用「過去曾提供」而非「現在有」。", "教授優先": "高", "教授視角": "臺灣雲市集與長照需求的落差有哪些可驗證資料？", "教授理由": "直接檢驗研究題目、研究標的與問題分析一致性。", "長官優先": "高", "長官視角": "雲市集工具是否仍適用？與長照專用平台如何避免重複？", "長官理由": "關係政策工具適切性及避免重複建置。", "原始問法": "雲市集是什麼？跟長照有什麼落差？", "資料提醒": "1:1點數補助是歷史措施，不是現行可申請經費。", "核對連結": "https://law.moda.gov.tw/LawContentSource.aspx?id=FL095994", "頁碼": "p.1、p.3", "主答": "呂承穎", "搜尋關鍵字": "雲市集 數產署 數發部 點數 補助 SaaS 落差 平台"}, {"編號": "6", "分類": "政策與對象", "必備核心": "", "題目": "非營利基金會一定算中小微企業嗎？能申請雲市集嗎？", "15秒簡答": "本組認為非營利機構不能一概視為中小微企業，補助資格應依各計畫規定確認。", "記憶關鍵字": "非營利不等同企業 → 逐案看資格 → 不綁舊補助 → 另規劃試辦", "口語詳答": "本組在整理長照產業時發現，服務提供者包含公司、社團法人、基金會及其他不同型態。組織規模小，不代表一定符合中小企業的法定定義；各年度雲市集方案的申請主體也可能不同。因此，本組不會直接認定所有非營利長照機構都能申請原有補助。若實際規劃試辦，必須先分別確認機構資格、資服業者資格與現行政策規定，再評估其他可行的輔導途徑。", "追問補充": "原始表內提到「資服業者提案」是部分方案機制，不代表所有時期的雲市集規則一樣。", "教授優先": "中", "教授視角": "非營利長照機構是否符合中小微企業或補助資格？", "教授理由": "涉及研究對象定義與政策適用範圍，屬重要補充。", "長官優先": "高", "長官視角": "不符合資格的基金會或法人要如何納入試辦？", "長官理由": "長官會直接追問補助資格、平等性與行政可執行性。", "原始問法": "非營利機構算中小微企業嗎？能用雲市集嗎？", "資料提醒": "不可保證非營利機構可取得點數補助。", "核對連結": "", "頁碼": "附件2 p.29", "主答": "呂承穎", "搜尋關鍵字": "非營利 基金會 中小微 資格 適用 申請 誰申請 營利"}, {"編號": "7", "分類": "政策與對象", "必備核心": "", "題目": "方案二由衛福部主責後，臺灣雲市集還有什麼關聯？", "15秒簡答": "本組把雲市集視為政策經驗，方案二則補上長照機構導入、學習與持續使用的缺口。", "記憶關鍵字": "雲市集政策經驗 → 工具與業者 → 補導入缺口 → 陪跑持續用", "口語詳答": "本組沒有主張所有長照機構都要重新透過雲市集購買系統。題目中的雲市集，是政府整合工具與資服業者的代表性政策經驗；本組提出的「轉型教練陪跑模式」，則是從長照機構實際需求出發。教練會先盤點原有設備與作業流程，能沿用的就優先沿用，不足的部分再評估媒合工具或技術支援。也就是借鏡平台經驗，但把政策成效放在實際使用，而不是購買數量。", "追問補充": "題名與方案間的關係可概括為「借鏡平台、改善導入、重視效益」。", "教授優先": "高", "教授視角": "方案二由衛福部主責後，題名為何仍寫臺灣雲市集？", "教授理由": "題目與結論是否脫節，是最容易被挑出的邏輯點之一。", "長官優先": "高", "長官視角": "雲市集、衛福部與數發部的實際角色如何串接？", "長官理由": "權責分工及跨部會合作必須說得具體。", "原始問法": "方案二由衛福部主責，雲市集還剩什麼角色？", "資料提醒": "", "核對連結": "", "頁碼": "表4-1 p.9", "主答": "郭哲宇", "搜尋關鍵字": "雲市集 角色 題目 關係 現行政策 不同 差異 補助政策"}, {"編號": "8", "分類": "研究與證據", "必備核心": "", "題目": "資服業者為什麼列為受影響群體，而不是合作夥伴？", "15秒簡答": "本組認為資服業者同時是受影響者與執行夥伴，利害關係人分類可以再補強。", "記憶關鍵字": "受影響者 → 合作夥伴 → 共同測試 → 分類可補強", "口語詳答": "本組在利害關係人分析中，把資服業者列為受影響群體，是因為方案可能要求廠商配合簡化介面、提供客服與系統介接。不過從實際執行來看，資服業者也必須參與需求討論與技術改善，確實是重要的合作夥伴。因此，本組認為這項分類還可以更完整，將資服業者定位為「受政策影響、同時參與執行」的利害關係人，並在推動時納入意見。", "追問補充": "宜坦承圖表可補強，不宜堅持資服業者只能是受影響群體。", "教授優先": "低", "教授視角": "資服業者在利害關係人圖中的分類是否恰當？", "教授理由": "利害關係人分類是細節，通常次於核心評選與效益。", "長官優先": "中", "長官視角": "資服廠商需要負責哪些服務水準和後續支援？", "長官理由": "長官會在採購、契約和客服責任上接著追問。", "原始問法": "資服業者為什麼只列「受影響群體」？", "資料提醒": "", "核對連結": "", "頁碼": "p.3–4", "主答": "呂承穎", "搜尋關鍵字": "利害關係人 資服業者 受影響 廠商 業者"}, {"編號": "9", "分類": "問題與策略", "必備核心": "是", "題目": "魚骨圖有六大因素，為何只聚焦人力與技術？財務呢？", "15秒簡答": "本組先盤點六大因素，再考量專題範圍，優先處理直接影響使用的人力與技術問題。", "記憶關鍵字": "六面向盤點 → 資源有限 → 聚焦人力技術 → 財務另配套", "口語詳答": "本組透過向右魚骨圖，先盤點人力、環境、技術、財務等六個面向；但基礎訓練專題的研究時間與方案資源有限，因此在解決建議中優先聚焦人力及技術。原因是即使有經費購買工具，若第一線不會操作，或缺少維護和系統整合，仍無法發揮效益。財務問題並未被忽略，本組仍在決策矩陣納入財務承受度，並建議透過分階段導入與成本評估降低負擔。", "追問補充": "不要用「現在雲市集還有點數補助，所以財務已解決」作理由；此說法不符合補助作業要點已廢止的現況。", "教授優先": "高", "教授視角": "六大因素如何篩選出人力與技術，是否有優先性證據？", "教授理由": "由問題診斷跳到優先方案，屬分析邏輯核心。", "長官優先": "高", "長官視角": "其他因素如資金、城鄉差距要如何配套處理？", "長官理由": "方案選定後仍須交代財務與制度面的配套。", "原始問法": "為什麼聚焦人力和技術？財務呢？ ／ 你們向右魚骨圖分析了六大因素，為什麼最後只選擇人力與技術？財務問題不是也很重要嗎？", "資料提醒": "舊數位點數補助已廢止，不能視為目前財務障礙已排除。", "核對連結": "https://law.moda.gov.tw/LawContentSource.aspx?id=FL095994", "頁碼": "圖3-1 p.5、圖4-1 p.8", "主答": "陳昱蓉", "搜尋關鍵字": "聚焦 人力 技術 財務 六面向 魚骨圖 為什麼"}, {"編號": "10", "分類": "研究與證據", "必備核心": "", "題目": "長照管理系統普及率已達84%，還需要談導入嗎？", "15秒簡答": "本組認為「有系統」不等於「用得好」，仍須處理操作、維運與系統資料整合。", "記憶關鍵字": "84%是部分調查 → 有系統≠用得好 → 操作與介接 → 維運持續", "口語詳答": "本組引用的84%是特定調查中的管理系統普及情形，不能直接代表所有類型長照機構都已完成數位轉型。即使已建置系統，仍可能遇到員工不熟悉操作、人員異動後缺乏交接、資料要重複登錄等問題。因此，本組所說的「導入」，不只是購買或安裝，而是包含實際使用、持續維護與流程改善。這也是本組提出教練陪跑的主要原因。", "追問補充": "原始表把「近三成」直接當作系統介接困難的比例，容易混淆調查題項；答辯時避免未核對分母就引用。", "教授優先": "高", "教授視角": "84%普及率的分母是什麼？與導入問題是否矛盾？", "教授理由": "易質疑統計外推、樣本及推論是否正確。", "長官優先": "中", "長官視角": "既有系統已很多，是否只需整合而不必再買系統？", "長官理由": "關心避免重複採購和系統整合的成本。", "原始問法": "系統普及率已達84%，還算「導入」問題嗎？", "資料提醒": "84%有樣本與調查範圍限制，勿說成全臺所有長照機構。", "核對連結": "https://ideas-dtri.iii.org.tw/%E7%94%A2%E6%A5%AD%E8%B3%87%E8%A8%8A/health-2/amp/", "頁碼": "p.6", "主答": "陳昱蓉", "搜尋關鍵字": "84% 普及率 矛盾 導入 已經有系統 資策會"}, {"編號": "11", "分類": "研究與證據", "必備核心": "", "題目": "引用Jubo業者資料，資料來源會不會不客觀？", "15秒簡答": "本組以官方與研究資料為主，業者文章作為實務觀察，不直接推論整個產業。", "記憶關鍵字": "官方研究為主 → 業者觀察為輔 → 區分立場 → 避免過度推論", "口語詳答": "本組理解資服業者的文章可能帶有商業立場，因此在蒐集資料時，以衛福部、資策會及研究文獻作為主要依據，業者資料則用來補充現場可能遇到的資安或操作情境。例如共用帳號或維護困難，可視為需要注意的風險，但不能因為一篇企業文章，就認定所有長照機構都有相同問題。本組也把資料來源的代表性列為研究限制之一。", "追問補充": "尤其共用帳號或弱點掃描不足應表述為「可能風險」而非斷言所有機構皆如此。", "教授優先": "中", "教授視角": "採用資服業者資料，如何避免利益衝突與證據偏誤？", "教授理由": "文獻可信度可能被追問，但不一定是主要題目。", "長官優先": "低", "長官視角": "若採購業者同時提供研究資料，如何保持公正？", "長官理由": "長官主要關心採購規範，業者文獻可信度非第一線核心。", "原始問法": "引用來源可信嗎？（Jubo是業者）", "資料提醒": "", "核對連結": "", "頁碼": "p.5–6", "主答": "呂曉琳", "搜尋關鍵字": "Jubo 智齡 業者 客觀 引用 來源 可信 年齡 楊梓峻 文獻"}, {"編號": "12", "分類": "評選與工具", "必備核心": "", "題目": "魚骨圖、決策矩陣、SWOT與TOWS之間怎麼串聯？", "15秒簡答": "本組用魚骨圖找原因與對策、決策矩陣選方案，再用SWOT／TOWS、甘特圖與KPI落實。", "記憶關鍵字": "右魚骨找問題 → 左魚骨找對策 → 矩陣選方案 → SWOT／TOWS → 甘特圖與KPI", "口語詳答": "本組先用向右魚骨圖整理造成長照數位轉型困難的原因，再以向左魚骨圖提出改善策略。接著把策略整併成替選方案，利用加權決策矩陣進行初步評選。選出方案二後，再用SWOT分析推動時的內外部條件，透過TOWS提出可行策略，最後用甘特圖安排兩年期工作，並設定KPI追蹤成效。這樣可以呈現方案管理從問題分析、方案選擇到執行評估的完整脈絡。", "追問補充": "若老師追問，SWOT屬診斷，TOWS屬策略組合，不能互相替代。", "教授優先": "高", "教授視角": "魚骨圖、決策矩陣、SWOT/TOWS、甘特圖各自解決何種問題？", "教授理由": "方案管理課程的工具正確使用，是典型教授考題。", "長官優先": "低", "長官視角": "分析工具如何轉成明確工作項目與主管機關責任？", "長官理由": "長官通常先看可行計畫，而不會細考工具定義。", "原始問法": "分析工具怎麼串起來？", "資料提醒": "", "核對連結": "", "頁碼": "p.5–14", "主答": "郭哲宇", "搜尋關鍵字": "方法 工具 魚骨圖 SWOT TOWS 甘特圖 架構 課程所學 分析"}, {"編號": "13", "分類": "問題與策略", "必備核心": "", "題目": "你們的轉型教練陪跑模式具體做什麼？", "15秒簡答": "本組規劃先做需求診斷，再分級培訓、到點陪跑，最後追蹤機構能否持續使用。", "記憶關鍵字": "需求診斷 → 分級培訓 → 到點陪跑 → 追蹤使用", "口語詳答": "本組提出的教練陪跑，不是由教練直接替機構決定買哪套系統，而是先了解排班、行政表單及照護紀錄等實際流程，確認哪些地方有重複作業。接著依人員數位程度安排短時數、分批次的教學，並到點協助操作。若涉及系統介接、資安等專業技術，再轉由相關資服業者或工程人員處理。最後持續追蹤使用情形，避免只辦完課程就結案。", "追問補充": "教練負責需求轉譯與操作協助，API及資安工程仍需專業技術團隊。", "教授優先": "中", "教授視角": "轉型教練陪跑與單次教育訓練有何不同？", "教授理由": "會用來檢驗方案內容，但教授可能先追問方案比較。", "長官優先": "高", "長官視角": "誰擔任教練、何時到點、每機構有哪些交付成果？", "長官理由": "方案執行責任、服務方式及工作產出是長官重點。", "原始問法": "陪跑模式怎麼做？", "資料提醒": "", "核對連結": "", "頁碼": "表4-1 p.9、表4-5 p.13", "主答": "郭哲宇", "搜尋關鍵字": "陪跑 教練 執行 怎麼做 步驟 方案二 內容"}, {"編號": "14", "分類": "評選與工具", "必備核心": "是", "題目": "決策矩陣為什麼選方案二？3.45分怎麼來？", "15秒簡答": "本組8位成員依六項指標評分後加權，方案二3.45分高於方案一2.96分，但仍是初步評估。", "記憶關鍵字": "六項指標 → 八人評分 → 加權計算 → 3.45 ＞ 2.96 → 仍需外部驗證", "口語詳答": "本組先依問題分析訂定六項衡量指標，再由8位組員分別以1至5分評估，取平均分數後乘以各項權重。最後方案二得到3.45分，高於方案一的2.96分，主要在技術整合、永續發展及工作效益等面向較有優勢。不過，這代表的是本組依相同標準所做的初步比較，並不是已經透過實證確認方案二一定最好。若正式推動，仍須加入機構、業者及專家評估。", "追問補充": "計算式：3.50×0.25＋3.63×0.15＋3.75×0.10＋3.63×0.25＋3.25×0.15＋2.63×0.10 ≈ 3.45（四捨五入）。", "教授優先": "高", "教授視角": "為何評分3.45與2.96？能否示範加權計算？", "教授理由": "決策矩陣計算和選案理據是核心課程內容。", "長官優先": "中", "長官視角": "評選結果如何支持實際選案與申請預算？", "長官理由": "長官也會關注選案基礎，但不一定細問小數計算。", "原始問法": "為什麼選方案二？3.45怎麼算？", "資料提醒": "", "核對連結": "", "頁碼": "表4-2 p.10", "主答": "郭哲宇", "搜尋關鍵字": "3.45 2.96 決策矩陣 分數 計算 加權 選擇 為什麼選"}, {"編號": "15", "分類": "評選與工具", "必備核心": "是", "題目": "方案二要花教練費，財務承受度為什麼還略高？", "15秒簡答": "本組評估方案二可能減少錯誤採購與閒置成本，但尚無完整試算，不能保證總成本較低。", "記憶關鍵字": "避免錯誤採購 → 減少閒置 → 分階段導入 → 尚未成本試算", "口語詳答": "本組在財務承受度上給方案二略高分數，主要是考量先盤點需求、分階段導入，可以降低機構買到不適用工具、重複採購或閒置的風險。不過，方案二確實也增加教練、培訓及技術支援成本，這次專題尚未完成政府與機構兩端的完整成本效益試算。因此，本組把這項評分定位為初步判斷，不能直接說方案二一定比較省錢，未來試辦前應進一步估算。", "追問補充": "方案一3.13、方案二3.25，差距0.12分、加權影響0.018；勿再以現行1:1點數補助做比較。", "教授優先": "高", "教授視角": "方案二增加人力成本，財務承受度卻高於方案一，合理嗎？", "教授理由": "評分尺度與財務概念不一致，是教授高可能追問。", "長官優先": "低", "長官視角": "若考慮政府總成本，方案二是否仍划算？", "長官理由": "長官會關心總預算，但未必從0.12分差切入。", "原始問法": "方案二財務承受度為什麼比較高？", "資料提醒": "不要把「方案二一定由政府全部支付」當作已核定事實。", "核對連結": "", "頁碼": "表4-2 p.10", "主答": "郭哲宇", "搜尋關鍵字": "財務 承受度 成本 比較省 費用 註5"}, {"編號": "16", "分類": "評選與工具", "必備核心": "是", "題目": "方案二政策支持度只有2.63，為什麼仍優先選它？", "15秒簡答": "本組承認方案二政策支持度較低，但六項加權總分仍較高，未來須先解決跨部會與經費問題。", "記憶關鍵字": "政策支持2.63 → 總分仍領先 → 跨部會協調 → 試辦降低風險", "口語詳答": "本組在決策矩陣中給方案二政策支持度2.63分，是因為它不像既有政策模式已有較成熟的執行架構，未來可能需要跨部會協調與試辦經費。但本組較重視第一線人員能否配合、行政負擔能否降低，因此綜合六項指標後，方案二仍有較高的加權總分。這並非忽視政策支持度，而是提醒本組的建議若要落實，必須先確認權責、預算及合作機制。", "追問補充": "政策支持度權重0.10，方案一為4.38；說明此指標的劣勢未被忽略。", "教授優先": "高", "教授視角": "政策支持度僅2.63，為何決策矩陣仍選方案二？", "教授理由": "會測試是否能解釋權重與總分的取捨。", "長官優先": "中", "長官視角": "政策支持弱勢如何克服，跨部會同意從何而來？", "長官理由": "長官重視跨部會可行性，但更可能直接問責任和預算。", "原始問法": "方案二政策支持度只有2.63，為什麼還選？", "資料提醒": "", "核對連結": "", "頁碼": "表4-2 p.10", "主答": "郭哲宇", "搜尋關鍵字": "政策支持度 2.63 4.38 分數低 註6"}, {"編號": "17", "分類": "評選與工具", "必備核心": "是", "題目": "權重為什麼這樣分配？評分有沒有主觀性？", "15秒簡答": "本組把人力配合與工作效益各設25%，反映減輕第一線負擔的目標；組內評分仍有主觀性。", "記憶關鍵字": "人力25% → 效益25% → 依痛點設定 → 組內評分有主觀 → 日後外部共評", "口語詳答": "本組訂定權重時，是依這次專題希望減少照護人員行政負擔的目的，將「人力配合度」及「工作效益度」各設為25%；技術整合與財務承受各15%，永續發展與政策支持各10%。至於評分，是8位組員依共同指標判斷，因此具有一定主觀性。本組不會把它說成客觀民調。若未來進入正式政策規劃，應邀請不同類型的長照機構與專家共同評分，並檢視權重改變時結果是否穩定。", "追問補充": "權重總和為1.00；可接受老師質疑，說明這是評選方法的限制，不應辯稱絕對客觀。", "教授優先": "高", "教授視角": "權重25%為何合理？八人評分有何客觀性及敏感度檢驗？", "教授理由": "權重、評分主觀性與方案結果穩健性非常貼近課程。", "長官優先": "低", "長官視角": "哪些指標會成為招標與驗收的實際審查標準？", "長官理由": "行政官較關注可衡量的執行指標，不會優先細究組內權重。", "原始問法": "權重怎麼定？分數客觀嗎？ ／ 你們的決策矩陣為什麼將人力配合度及工作效益度各設定25%？又如何確保方案二獲選不是主觀判斷？", "資料提醒": "", "核對連結": "", "頁碼": "表4-2 p.10", "主答": "郭哲宇", "搜尋關鍵字": "權重 客觀 主觀 評分 標準 指標"}, {"編號": "18", "分類": "評選與工具", "必備核心": "", "題目": "只有兩個替選方案，方案一會不會只是陪襯？", "15秒簡答": "本組以既有政策模式當對照，將重疊改善策略整併為方案二；但兩案比較確實有限。", "記憶關鍵字": "現有模式作對照 → 方案整併 → 方案二陪跑 → 兩案有限制", "口語詳答": "本組在研討過程中，曾討論專業輔導、分階段導入、技術整合等不同方向，後來因為部分策略彼此重疊，逐步整併成「轉型教練陪跑模式」，並以既有雲市集政策模式作為比較基準。方案一不是刻意設計成低分的陪襯。不過，本組也承認只比較兩案，範圍仍有限；若未來要作正式政策決策，可以再增加純技術整合或人才培訓等方案，進行更完整的比較。", "追問補充": "附件討論紀錄保留四案→三案→兩案的過程；維持模式應說「既有政策模式」，勿假設點數補助仍實施。", "教授優先": "高", "教授視角": "兩個方案是否公平比較？方案一是否被設計成陪襯？", "教授理由": "檢驗替選方案互斥性、公平性與方案選擇完整度。", "長官優先": "低", "長官視角": "若經費不足，可否採取階段性或混合式方案？", "長官理由": "長官偏重立即可行的替代作法，而非概念上的稻草人批判。", "原始問法": "方案一是不是稻草人？為什麼只比兩案？", "資料提醒": "", "核對連結": "", "頁碼": "附件2 p.33–40", "主答": "郭哲宇", "搜尋關鍵字": "稻草人 對照 兩案 方案一 合併 替選方案 為什麼只有"}, {"編號": "19", "分類": "執行與績效", "必備核心": "", "題目": "為什麼建議衛福部主責、數發部協辦？", "15秒簡答": "本組建議衛福部掌握長照需求，數發部協助技術與業者媒合；正式權責仍須協商。", "記憶關鍵字": "衛福部掌握需求 → 數發部技術協助 → 政府分工 → 須協商權責", "口語詳答": "本組建議由衛福部主責，是因為長照機構的服務流程、照護品質及第一線人員需求，與衛福部業務較直接相關；而資訊技術、工具選擇及資服業者媒合，可借重數發部的專業。因此，本組認為跨部會分工比單一機關包辦更適合。不過，這是我們在基礎訓練專題中提出的政策建議，並不是兩部會已決定採行的方案，實際權責仍須由主管機關協商。", "追問補充": "如涉及經濟部中企署資源，應確認該年度計畫是否能適用長照機構。", "教授優先": "中", "教授視角": "衛福部與數發部的分工有什麼政策依據？", "教授理由": "角色安排是方案架構一部分，非單純評分重點。", "長官優先": "高", "長官視角": "由誰當主責、誰出經費、誰辦採購、誰管理成果？", "長官理由": "跨機關權責、主計經費及執行單位最常被長官追問。", "原始問法": "為什麼由衛福部主責？", "資料提醒": "", "核對連結": "", "頁碼": "p.3、表4-5 p.13", "主答": "郭哲宇", "搜尋關鍵字": "衛福部 數發部 主責 協辦 分工 機關 跨部會 中企署"}, {"編號": "20", "分類": "執行與績效", "必備核心": "是", "題目": "教練人力與經費從哪來？為什麼試辦兩年、10家？現有資源有哪些？", "15秒簡答": "本組建議先盤點既有輔導資源，再估算兩年、10家試辦所需經費；目前尚未核定。", "記憶關鍵字": "盤點既有資源 → 試辦10家兩年 → 估算教練與經費 → 尚未核定", "口語詳答": "本組規劃兩年期、先由10家機構試辦，是希望以可控制的規模完成需求診斷、初步導入、陪跑及成效追蹤。至於經費，本組目前沒有完整預算，也沒有已核定的教練編制。可以先參考衛福部住宿機構照顧品質獎勵計畫，以及經濟部數位診斷、培訓等既有輔導經驗，確認哪些資源能合作，再估算教練人力、差旅及技術服務費。各計畫的適用資格與經費不能直接混用，仍要依法評估。", "追問補充": "既有例子：衛福部113–116年住宿機構照顧品質獎勵計畫；經濟部中企署數位轉型輔導資源「作法可參考、資格及經費須核對」。10家不是統計推論所需樣本數。", "教授優先": "高", "教授視角": "兩年十家試辦的選樣與規模依據為何？", "教授理由": "資源估算不足會影響整體方案可行性評價。", "長官優先": "高", "長官視角": "預算怎麼編、數位教練從哪裡來、能否運用既有計畫？", "長官理由": "直接牽涉經費來源、員額、採購與執行可行性。", "原始問法": "經費、教練人力從哪來？為什麼兩年、10家？ ／ 你們提出兩年期轉型教練陪跑方案，經費從哪裡來？數位教練由誰負責？政府有沒有現成資源可以運用？ ／ 有哪些現成政策？", "資料提醒": "既有獎勵計畫適用住宿機構，不代表居家式與社區式當然符合資格；不能直接挪用預算。", "核對連結": "https://1966.gov.tw/LTC/cp-6457-69926-207.html", "頁碼": "表4-5 p.13、KPI p.14", "主答": "郭哲宇", "搜尋關鍵字": "經費 預算 錢 教練人數 人力 兩年 24個月 10家 樣本 規模"}, {"編號": "21", "分類": "執行與績效", "必備核心": "是", "題目": "20%工時、80%通過率，以及10／8／5家目標如何訂定與驗證？", "15秒簡答": "本組設定的20%、80%及10／8／5家，是試辦目標，不是已有成效；須導入前後比較驗證。", "記憶關鍵字": "20%工時 → 80%實作 → 10／8／5家 → 屬預期目標 → 前後比較驗證", "口語詳答": "本組設定第一年診斷10家機構，並以8家完成基礎數位化、5家進一步導入照護紀錄，以及人員操作測驗通過率80%為預期目標。行政作業時間縮短20%，則要先記錄導入前排班、填表或服務紀錄的基準工時，再用相同作業口徑比較導入後的時間。這些是方案管理上的初步目標，還不是實際成果。如果沒有達標，本組建議檢討教學方式、工作流程及系統適用性，再滾動修正。", "追問補充": "20%、80%、10/8/5家都是小組設定，尚無試辦實證或樣本數推估；除工時外，可增加持續使用率、紀錄完整率等。", "教授優先": "高", "教授視角": "工時20%、測驗80%、10/8/5家如何設定與驗證？", "教授理由": "SMART與績效指標是否可衡量是課程核心。", "長官優先": "高", "長官視角": "誰蒐集基準值，如何驗收，未達標會怎麼辦？", "長官理由": "KPI驗收、預算績效及結果追蹤是長官常問的重點。", "原始問法": "行政時間縮短20%的依據？沒達標怎麼辦？ ／ 8家、5家、80%怎麼訂？ ／ 你們預期行政作業時間縮短20%、人員測驗通過率達80%，這些數字怎麼訂定？要如何證明方案真的有效？", "資料提醒": "", "核對連結": "", "頁碼": "p.14", "主答": "郭哲宇", "搜尋關鍵字": "20% KPI 績效 依據 達標 失敗 成效 服務品質 證明 8家 5家 80% 怎麼訂"}, {"編號": "22", "分類": "問題與策略", "必備核心": "", "題目": "照服員已經很忙，又不願學新系統，陪跑會不會更添負擔？", "15秒簡答": "本組建議配合排班、短時分批教學，先從省時流程著手；紙電雙軌須設定退場條件。", "記憶關鍵字": "配合排班 → 短時分批 → 先做省時流程 → 紙電雙軌退場", "口語詳答": "本組考量長照機構人力吃緊，如果要求照護人員長時間離開工作崗位上課，確實可能增加負擔。因此，本組建議由教練到點提供短時數、分批次教學，並配合機構排班。初期優先挑選排班、出勤與重複表單等較容易看見效益的工作，讓人員建立使用信心。紙本與電子紀錄可以短期並行，但要設定何時轉換與停止雙軌，避免把數位化變成額外工作。", "追問補充": "切勿說紙電雙軌「一定不增加負擔」；短期可能增加，應有退場條件。", "教授優先": "中", "教授視角": "陪跑真的能處理人力短缺嗎？會否增加負擔？", "教授理由": "涉及策略因果與現場可行性，有合理追問可能。", "長官優先": "高", "長官視角": "機構沒有時間受訓，怎麼安排服務不中斷？", "長官理由": "人力排班、參與誘因和不影響照護是執行關鍵。", "原始問法": "機構缺人、怕增加負擔、不願配合怎麼辦？", "資料提醒": "", "核對連結": "", "頁碼": "p.7–8", "主答": "郭哲宇", "搜尋關鍵字": "缺人 上課 負擔 不配合 抗拒 意願 年長 照服員 培訓 排班 評鑑"}, {"編號": "23", "分類": "問題與策略", "必備核心": "", "題目": "為什麼不建全國統一系統，而要談API與資料交換標準？", "15秒簡答": "本組主張先檢視共通欄位與資料交換需求，不要求所有機構立即全面改用同一套系統。", "記憶關鍵字": "機構需求不同 → 先共通欄位 → 資料交換標準 → 不強制統一", "口語詳答": "本組考量住宿式、居家式及社區式長照的業務流程不同，而且機構既有系統也不一致。如果直接要求全部更換同一套系統，可能增加資料轉移、教育訓練及設備成本。因此，本組建議先盤點共同需要交換的資料，逐步評估格式標準與必要介接。至於API技術、資料權限和資安法遵，應由主管機關與資訊專業團隊研議；本組提出的是方向，並非已確認可直接串接。", "追問補充": "報告中的「優先整合衛福部系統」是建議方向，非已取得介接授權或保證技術可行。", "教授優先": "低", "教授視角": "資料格式統一與API是否超出本組方案範圍？", "教授理由": "技術細節通常低於決策工具的考核優先度。", "長官優先": "高", "長官視角": "跨系統介接涉及個資與權限，誰有權核准？", "長官理由": "長官重視法令授權、介接審查及系統維運責任。", "原始問法": "系統接不起來？為什麼不做全國統一系統？", "資料提醒": "應先確認資料治理、主管機關授權與資安法遵。", "核對連結": "", "頁碼": "p.7–8", "主答": "郭哲宇", "搜尋關鍵字": "串接 介接 API 整合 統一系統 全國 標準 格式"}, {"編號": "24", "分類": "評選與工具", "必備核心": "", "題目": "SWOT說多數機構已有系統，為什麼又要處理設備不足？", "15秒簡答": "本組認為部分機構已有數位基礎，但各機構條件仍有差異，所以需要個別盤點。", "記憶關鍵字": "已有部分基礎 → 機構差異大 → 設備與流程盤點 → 按需求導入", "口語詳答": "本組在SWOT優勢面提到部分機構已有基本數位設備，代表可以從現有基礎逐步改善；但劣勢面也指出不同機構的規模、人力及資訊能力差異很大，不能假設每一間都準備好了。因此，本組認為兩者並不矛盾，正因為起點不同，才需要先進行需求與設備診斷，再安排不同程度的輔導。另外，84%的調查數字有特定對象，不能代表所有長照機構。", "追問補充": "調查的84%不能代表所有長照機構，建議避免以此單一數字證明全部機構設備充足。", "教授優先": "低", "教授視角": "SWOT優勢與劣勢是否有互相矛盾或分類不精準？", "教授理由": "可能是圖表細節檢查，但未必優先。", "長官優先": "低", "長官視角": "是否要先做設備與系統清查才可進入試辦？", "長官理由": "設備盤點屬基本程序，較少單就SWOT文字發問。", "原始問法": "SWOT說多數有設備，又說要處理設備不足？", "資料提醒": "", "核對連結": "", "頁碼": "表4-3 p.11", "主答": "郭哲宇", "搜尋關鍵字": "SWOT 矛盾 設備 電腦 不足 優勢"}, {"編號": "25", "分類": "風險與永續", "必備核心": "", "題目": "什麼是地端AI？是不是就完全沒有個資風險？", "15秒簡答": "本組把地端AI視為未來可評估的工具，可能減少部分外部資料傳輸，但不能保證零風險。", "記憶關鍵字": "本地運算 → 少傳輸資料 → 不是零風險 → 仍要資安管理", "口語詳答": "本組在報告中提到地端AI，主要是指將部分AI運算放在機構可控制的設備或環境中，減少將原始資料傳送到外部服務的需求。不過，即使採地端方式，仍須處理設備維護、帳號權限、備份及資安漏洞等問題，所以不能說地端AI就絕對安全。這次專題只是把它列為未來可以評估的方向，並未規劃兩年試辦內一定導入AI，也沒有完成資安測試。", "追問補充": "不可等同「地端=完全不上網」或「地端=絕對安全」。", "教授優先": "低", "教授視角": "地端AI和雲端AI有何差異，能解決所有資安疑慮嗎？", "教授理由": "屬延伸技術名詞，非本次主要方案管理工具。", "長官優先": "低", "長官視角": "採用地端AI是否有額外成本、維護與資安風險？", "長官理由": "長官如關注AI會問，但本方案先處理基礎數位化。", "原始問法": "地端AI是什麼？", "資料提醒": "", "核對連結": "", "頁碼": "p.7–8", "主答": "陳昱蓉", "搜尋關鍵字": "地端AI AI 人工智慧 雲端 本地"}, {"編號": "26", "分類": "風險與永續", "必備核心": "", "題目": "長照資料包含敏感資訊，個資和資安怎麼保護？", "15秒簡答": "本組建議導入前先做資安檢核，落實權限分級、不共用帳號、操作紀錄及教育訓練。", "記憶關鍵字": "導入前檢核 → 權限分級 → 帳號不共用 → 留下操作紀錄 → 持續訓練", "口語詳答": "本組認為長照系統處理服務對象的健康與照護資訊，資安和個資保護應該從規劃階段就納入，而不是系統上線後再補。具體作法包括依工作職責分級授權、避免共用帳號、保留操作紀錄，並要求資服業者說明維護與事件處理方式。如果要做跨系統資料交換，也應先確認資料使用目的、必要範圍及相關法令要求。這些是本組建議的管理方向，不代表所有機構目前都已採行。", "追問補充": "來源提到115年12月起擬推實體卡證驗證；截至115年11月18日屬未來措施，不能說已全面施行。", "教授優先": "中", "教授視角": "資安策略如何和紙電雙軌、個資保護連結？", "教授理由": "關乎風險管理，可能列為中等重要問題。", "長官優先": "高", "長官視角": "個資外洩由誰負責，怎麼管帳號權限、契約和通報？", "長官理由": "長照個資敏感，行政責任與資安控管屬高關注點。", "原始問法": "個資怎麼保護？", "資料提醒": "不要承諾固定每日備份或每年滲透測試是所有機構已實施的標準。", "核對連結": "", "頁碼": "p.7–8", "主答": "陳昱蓉", "搜尋關鍵字": "個資 資安 隱私 外洩 帳號 共用"}, {"編號": "27", "分類": "風險與永續", "必備核心": "", "題目": "結語提到AI，但方案裡沒有具體導入AI，是不是前後不一致？", "15秒簡答": "本組把AI定位為長期願景；兩年試辦優先建立行政數位化、資料品質與操作能力。", "記憶關鍵字": "AI是長期願景 → 先做行政數位化 → 資料品質 → 能力成熟再導入", "口語詳答": "本組的兩年期方案，優先處理排班、行政表單與照護紀錄等基礎數位化工作，因為若資料仍不完整、操作習慣尚未建立，直接導入AI未必有預期效益。因此，結語提到AI與智慧照護，是本組對未來發展的展望，不是這次試辦已經編列的工作項目或KPI。待機構有穩定的資訊流程與人員能力後，再評估是否適合導入更進階的科技，較符合循序漸進原則。", "追問補充": "將「AI」定位為願景與可能的下一階段，不可說本次KPI包含AI成果。", "教授優先": "中", "教授視角": "結語AI願景是否和方案內容前後一致？", "教授理由": "文字前後一致性會被檢查，但非核心決策問題。", "長官優先": "中", "長官視角": "試辦是否會納入AI？若會，何時且經費從哪裡來？", "長官理由": "長官可能問AI是否為新增工作或既定承諾。", "原始問法": "結語提到AI，方案裡卻沒有？", "資料提醒": "", "核對連結": "", "頁碼": "p.15", "主答": "吳倍儀", "搜尋關鍵字": "結語 AI 人工智慧 願景 超出"}, {"編號": "28", "分類": "風險與永續", "必備核心": "", "題目": "兩年試辦結束後，沒有教練要怎麼持續？", "15秒簡答": "本組建議培育機構種子人員、留下操作教材與維護窗口，降低對單一教練的依賴。", "記憶關鍵字": "培育種子人員 → 留下教材 → 建立客服窗口 → 交接與維運", "口語詳答": "本組特別重視試辦結束後能否持續運作。如果只有教練在場時有人會用，教練離開後又停用，就沒有真正達成轉型。因此，本組在方案中安排培育機構內部的種子人員，建立操作教材、問題處理紀錄與人員交接機制，並與資服業者確認客服及維護責任。未來也應追蹤機構持續使用情形，並在試辦前估算結束後的維護費用，避免把負擔留給機構。", "追問補充": "正式試辦前須評估後續維護費、交接責任及系統更新支援，不是靠一份懶人包就能保證永續。", "教授優先": "中", "教授視角": "陪跑計畫結束後如何證明永續發展度？", "教授理由": "永續是決策矩陣要素，會評估推論是否充分。", "長官優先": "高", "長官視角": "兩年後誰維護、人員異動如何交接、是否持續花錢？", "長官理由": "計畫退出機制、後續維運費用與知識傳承屬高風險。", "原始問法": "試辦結束後怎麼延續？", "資料提醒": "", "核對連結": "", "頁碼": "p.7–8、結語", "主答": "吳倍儀", "搜尋關鍵字": "永續 延續 結束後 沒預算 種子教師 客服"}, {"編號": "29", "分類": "核心立場", "必備核心": "", "題目": "科技數位化會不會取代照服員？", "15秒簡答": "本組希望減少重複文書，讓照護人員更專注長者需求，而不是以科技取代照服員。", "記憶關鍵字": "減少重複文書 → 不是取代人力 → 時間回到照護 → 提升品質", "口語詳答": "本組提出長照數位轉型，目的並不是減少長者獲得的照顧，也不是認為系統能取代照服員的觀察、陪伴與溝通。比較希望改善的是排班、紀錄整理與重複登錄等行政工作，讓照護人員有機會把時間留給長者。當然，行政工時減少是否真的轉化成服務品質提升，還需要實際追蹤與評估。這也是本組結語強調科技應以人本照護為核心的原因。", "追問補充": "可用作結語，避免宣稱數位化必然增加照護品質，仍需實際評估。", "教授優先": "低", "教授視角": "數位工具是否和「以人為本」的結語相符？", "教授理由": "屬價值型延伸題，通常低於方法與績效。", "長官優先": "中", "長官視角": "照服員與家屬擔心工作被取代，要如何溝通？", "長官理由": "政策溝通及服務接受度可能被提及但非最主要。", "原始問法": "會不會取代照服員？", "資料提醒": "", "核對連結": "", "頁碼": "p.15", "主答": "吳倍儀", "搜尋關鍵字": "取代 失業 照服員 人力 科技"}, {"編號": "30", "分類": "政策與對象", "必備核心": "", "題目": "目前有哪些長照單位或業者參與臺灣雲市集？", "15秒簡答": "本組尚無完整且經核對的雲市集長照參與名冊，不能把科技業者案例直接當成受補助名單。", "記憶關鍵字": "無完整參與名冊 → 業者不等於受補助者 → 需官方查證 → 不冒稱參與", "口語詳答": "本組蒐集過Jubo、銀色大門等長照科技業者，以及貴族長照中心、大瑩交通派案、展橙送餐等數位化案例。不過，「提供長照科技服務」和「實際參與特定年度臺灣雲市集計畫」是兩回事。本組目前沒有取得完整、可核對的申請或獲補助名單，因此不會直接宣稱這些企業都曾參與雲市集。若老師問實際參與家數，本組會說明這是資料限制，須再向主管機關確認。", "追問補充": "原始回答列的市場占有率、服務機構數及IPO等資料未逐項核對；網頁不將其當成已驗證的雲市集參與名單。", "教授優先": "低", "教授視角": "是否確有臺灣雲市集長照導入標竿案例？", "教授理由": "案例核實有價值，但如資料不足也可作補充。", "長官優先": "高", "長官視角": "可以提出一家實際機構與具體效益數據嗎？", "長官理由": "長官重視具體成果與能否複製，不只理論。", "原始問法": "目前有哪些長照單位參與台灣雲市集計畫", "資料提醒": "目前未取得實際受補助單位名冊，請勿臨場聲稱某公司已參與。", "核對連結": "", "頁碼": "附件2 p.27–30", "主答": "全員", "搜尋關鍵字": "參與 名冊 名單 Jubo 銀色大門 貴族 大瑩 展橙 受補助 標竿 案例 業者"}, {"編號": "31", "分類": "研究與證據", "必備核心": "", "題目": "為什麼沒有完整比較臺灣與國外的數位轉型政策？", "15秒簡答": "本組受限於專題篇幅與研究範圍，先聚焦國內長照困境；國際政策尚未完成完整比較。", "記憶關鍵字": "篇幅與時間有限 → 以國內長照為主 → 未系統比較 → 後續可補國際", "口語詳答": "本組在蒐集資料時，確實注意到不同國家有數位診斷、培訓或補助等推動方式。但這次基礎訓練專題的篇幅與時間有限，本組沒有用相同的評估指標，完整比較各國制度與成效，因此不適合直接判斷哪一國做得最好。本組選擇先說清楚臺灣長照機構的問題及可行方案；老師的建議可列為後續研究方向，再進一步比較國際上的輔導與維運措施。", "追問補充": "原始表列新加坡、日本、韓國、美國作法，但未附完整可查證的同口徑依據；避免把零散印象當正式比較結果。", "教授優先": "中", "教授視角": "為何缺少國際案例比較，影響研究完整性嗎？", "教授理由": "屬研究範圍檢討，中等程度備答。", "長官優先": "低", "長官視角": "其他國家哪個經驗最值得轉化成地方試辦？", "長官理由": "本組核心是國內試辦執行，跨國比較通常較低優先。", "原始問法": "你們沒有分析國內外政府推行數位轉型之比較", "資料提醒": "", "核對連結": "", "頁碼": "研究限制、附件2", "主答": "全員", "搜尋關鍵字": "國際 國外 外國 比較 新加坡 日本 韓國 美國"}, {"編號": "32", "分類": "研究與證據", "必備核心": "是", "題目": "立心基金會的系統後來沒有持續使用，為何還建議數位轉型？", "15秒簡答": "本組認為立心案例反映的是後續維運與人員交接問題，更支持陪跑與知識傳承的必要性。", "記憶關鍵字": "立心非正式分享 → 主管與人員異動 → 缺交接維運 → 陪跑與傳承", "口語詳答": "本組參考立心基金會相關員工的非正式經驗分享，得知居家排班系統初期因主管參與流程盤點而較能符合需求，但後來隨著主管及人員異動，操作知識不容易延續，系統逐漸停用。對本組來說，這不是說數位轉型不可行，而是提醒我們不能只看導入當下，還需要建立人員交接、持續教學與系統調整機制。由於不是正式訪談，本組也不會把這個案例推論成所有長照機構的情況。", "追問補充": "此為非正式經驗分享，不是正式訪談或經機構授權的量化績效資料；不要說「已證實立心使用雲市集某方案」。", "教授優先": "高", "教授視角": "立心系統荒廢是否反駁你們方案，證據如何使用？", "教授理由": "成效不佳案例可檢驗方案的問題診斷與研究限制。", "長官優先": "高", "長官視角": "如何避免主管異動後系統荒廢、浪費公帑？", "長官理由": "第一線實務失敗案例會直接連到維運與交接設計。", "原始問法": "既然立心的系統最後荒廢，為什麼還建議推動數位轉型？", "資料提醒": "僅作非正式個案說明，注意尊重機構及受訪者。", "核對連結": "", "頁碼": "附件2、組員分享", "主答": "全員", "搜尋關鍵字": "立心 基金會 荒廢 停用 交接 異動 失敗案例 維運"}, {"編號": "33", "分類": "政策與對象", "必備核心": "", "題目": "點數補助已經廢止，為什麼還研究臺灣雲市集？", "15秒簡答": "本組研究的是雲市集的政策經驗與導入障礙，不會把已廢止的點數補助當作現行經費。", "記憶關鍵字": "舊點數已廢止 → 政策經驗可借鏡 → 不列現行補助 → 提出陪跑改進", "口語詳答": "本組注意到，原有臺灣雲市集數位點數補助作業要點已於115年8月18日廢止，因此在答詢時會清楚說明，這是過去的政策措施，不能當成目前仍可申請的補助。本組仍以雲市集為研究案例，是因為它整合數位工具與資服業者的經驗，能幫助我們思考政策如何降低導入門檻。這次提出的教練陪跑模式，是在此經驗上補強實際使用與維運，不是主張恢復舊補助。", "追問補充": "數位點數補助作業要點廢止與雲市集網站是否存在是兩件事；本組只確認前者。", "教授優先": "高", "教授視角": "點數補助已廢止，方案一是否還能當現行政策對照？", "教授理由": "政策時間效力攸關整份研究的政策基礎。", "長官優先": "高", "長官視角": "原補助已結束，新的試辦如何找到合法資源？", "長官理由": "長官會從法令效力與實際經費可用性質疑。", "原始問法": "臺灣雲市集原有的數位點數補助已經廢止，為什麼你們還選擇臺灣雲市集作為研究案例？", "資料提醒": "官方法規沿革：115年8月18日廢止原數位點數補助作業要點。", "核對連結": "https://law.moda.gov.tw/LawContentSource.aspx?id=FL095994", "頁碼": "前言 p.1、現況 p.3", "主答": "全員", "搜尋關鍵字": "廢止 點數 補助 已廢止 8月18日 要點 法規 時效 現行"}];

function parseCSV(t){
  const out=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);out.push(row);row=[];f="";} else if(c!=='\r') f+=c; }
  if(f!==""||row.length){row.push(f);out.push(row);}
  const h=out.shift()||[]; return out.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]||""])));
}
function stamp(){ const d=new Date(); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function loadLocal(){
  try{ const c=JSON.parse(localStorage.getItem("g5qa_cache")||"null"); if(c&&c.rows&&c.rows.length&&(SCHEMA_KEY in c.rows[0])){ CARDS=toCards(c.rows); SRC={mode:"cache",at:c.at}; return true; } }catch(e){}
  return false;
}
async function loadSheet(){
  for(const u of CSV_URLS){
    try{
      const r=await fetch(u+"&_="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const rows=parseCSV(await r.text());
      if(!rows.length || !("題目" in rows[0]) || !(SCHEMA_KEY in rows[0])) continue;
      CARDS=toCards(rows); SRC={mode:"live",at:stamp()};
      try{ localStorage.setItem("g5qa_cache",JSON.stringify({rows,at:SRC.at})); }catch(e){}
      render(); return;
    }catch(e){}
  }
  if(CSV_URLS.length){ SRC.fail=true; render(); }
}
// ---- view ----
let state={view:"all",who:"all",q:"",core:false};
try{ const s=JSON.parse(localStorage.getItem("g5qa")||"{}"); if(s.who) state.who=s.who; }catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf=id=>(PEOPLE.find(p=>p.id===id)||{}).name||id;
function fmt(text){
  let t=esc(text);
  t=t.replace(/\*\*([\s\S]+?)\*\*/g,'<b class="hl">$1</b>').replace(/\n/g,"<br>");
  if(state.q){ const q=esc(state.q); t=t.split(/(<[^>]+>)/).map(seg=>seg.startsWith("<")?seg:seg.split(q).join("<mark>"+q+"</mark>")).join(""); }
  return t;
}
function roleOf(c){
  if(c.m==="all") return "all";
  if(state.who==="all"||PRESENTERS.includes(state.who)) return null;
  if(c.m.includes(state.who)) return "mine";
  return "none";
}
function match(c){
  if(!state.q) return true;
  const hay=[c.q,c.k,c.mem,c.l,c.f,c.pt,c.pr,c.ot,c.or,c.o,c.w,c.cat,c.kw,c.p,"q"+c.id,"q"+c.id.padStart(2,"0")].join(" ").replace(/\*/g,"").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
const LV={"高":"hi","中":"mid","低":"lo"};
const pri=lv=>lv?`<span class="pri ${LV[lv]||"lo"}"><i></i>${esc(lv)}</span>`:"";
function memHTML(s){ return s?'<div class="mem">'+s.split(/\s*→\s*/).map(x=>"<span>"+fmt(x)+"</span>").join("<b>→</b>")+"</div>":""; }
function viewHTML(name,lv,text,why){
  return text?`<div class="view"><div class="vh">${name}視角 ${pri(lv)}</div>${fmt(text)}${why?`<small>判斷理由：${fmt(why)}</small>`:""}</div>`:"";
}
function cardHTML(c){
  const owners=c.m==="all"?"全員":"主答　"+c.m.map(nameOf).join("、");
  const sub=(c.core?'<span class="star">★ 必備核心</span>':"")+(c.pl?`<span>教授 ${pri(c.pl)}</span>`:"")+(c.ol?`<span>長官 ${pri(c.ol)}</span>`:"");
  return `<div class="card${c.core?" main":""}${state.q?" open":""}">
    <button class="q"><span class="n">${esc(c.id)}</span><span class="t">${fmt(c.q)}${sub?`<span class="sub">${sub}</span>`:""}</span></button>
    <div class="a">
      ${c.k?`<p class="key"><span class="lab">15 秒簡答</span>${fmt(c.k)}</p>`:""}
      ${memHTML(c.mem)}
      ${c.l?`<div class="blk"><h4>40–60 秒口語詳答</h4><p>${fmt(c.l)}</p></div>`:""}
      ${c.f?`<div class="blk"><h4>老師追問時補充</h4><p>${fmt(c.f)}</p></div>`:""}
      ${viewHTML("教授",c.pl,c.pt,c.pr)}${viewHTML("長官",c.ol,c.ot,c.or)}
      ${c.w?`<div class="warn"><em class="amb">資料提醒</em>${fmt(c.w)}</div>`:""}
      ${c.o?`<p class="orig">對應原始問法：${fmt(c.o)}</p>`:""}
      <div class="meta">${c.p?`<span class="pg">${esc(c.p)}</span>`:""}<span class="ow">${esc(owners)}</span>${c.cat?`<span class="ow">${esc(c.cat)}</span>`:""}${/^https:\/\//.test(c.link)?`<a class="lnk" href="${esc(c.link)}" target="_blank" rel="noopener">核對參考資料</a>`:""}</div>
    </div></div>`;
}
function syncHTML(){
  if(!SHEET_ID) return "";
  const txt = SRC.mode==="live" ? `<span><i class="dot"></i>已同步　${SRC.at}</span>` :
              SRC.mode==="cache" ? `<span><i class="dot off"></i>${SRC.fail?"離線，":""}上次同步　${SRC.at}</span>` :
              `<span><i class="dot off"></i>${SRC.fail?"讀不到試算表，用內建版":"同步中…"}</span>`;
  return `<div class="sync">${txt}<a href="${EDIT_URL}" target="_blank" rel="noopener">編修擬答</a></div>`;
}
function numTable(list){ return '<div class="tbl"><table>'+list.map(n=>`<tr><td class="num">${n[0]}</td><td>${n[1]}</td><td class="p"><span>${n[2]}</span></td></tr>`).join("")+'</table></div>'; }
function numsHTML(){ return `<div class="sec">數字速查</div>
  <div class="formula"><div>方案二　3.50×0.25＋3.63×0.15＋3.75×0.1＋3.63×0.25＋3.25×0.15＋2.63×0.1＝<b>3.45</b></div><div>方案一　3.25×0.25＋2.00×0.15＋1.88×0.1＋3.00×0.25＋3.13×0.15＋4.38×0.1＝<b>2.96</b></div></div>
  <div style="height:10px"></div>${numTable(NUMS)}`; }
const NOTE='<div class="note"><b>政策時效提醒：</b>原雲市集 1:1 數位點數補助作業要點已於 115 年 8 月 18 日廢止。以下為本組基礎訓練專題口語擬答與政策建議，不是已核定或已實施的官方新計畫。</div>';
function drawSeg(){
  const n=CARDS.filter(c=>c.core).length;
  $("#seg").innerHTML=`<button class="sg${state.core?"":" on"}" data-core="0">全部 ${CARDS.length} 題</button><button class="sg${state.core?" on":""}" data-core="1">★ 必備核心 ${n} 題</button>`;
}
function render(){
  const m=$("#main"); drawPeople(); drawSeg();
  const list=CARDS.filter(c=>roleOf(c)!=="none" && (!state.core||c.core) && match(c));
  const numHits=state.q?NUMS.filter(n=>n.join("").toLowerCase().includes(state.q.toLowerCase())):[];
  let html=syncHTML()+NOTE;
  if(!list.length && !numHits.length){ m.innerHTML=html+'<p class="empty">'+(state.q?"沒有對應的題目，換個關鍵字試試":"這個條件下沒有題目")+'</p>'; return; }
  if(list.length) html+=`<div class="sec">${state.core?"必備核心":"答詢題庫"}<small>${list.length} 題</small></div>`+list.map(cardHTML).join("");
  if(state.q){ if(numHits.length) html+='<div class="sec">數字</div>'+numTable(numHits); }
  else if(!state.core) html+=numsHTML();
  html+=`<p class="foot">擬答 v2・共 ${CARDS.length} 題</p>`;
  m.innerHTML=html;
}
// ---- events ----
$("#main").addEventListener("click",e=>{ const b=e.target.closest(".q"); if(b) b.parentElement.classList.toggle("open"); });
$("#seg").addEventListener("click",e=>{ const b=e.target.closest("button[data-core]"); if(!b) return; state.core=b.dataset.core==="1"; render(); });
$("#q").addEventListener("input",e=>{ state.q=e.target.value.trim(); $("#clr").style.display=state.q?"block":"none";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.textContent===state.q)); render(); });
function openSearch(){ $("#spanel").hidden=false; $("#sbtn").hidden=true; setTimeout(()=>$("#q").focus(),30); }
function closeSearch(){ $("#q").value=""; $("#q").dispatchEvent(new Event("input")); $("#spanel").hidden=true; $("#sbtn").hidden=false; }
$("#sbtn").onclick=openSearch; $("#scancel").onclick=closeSearch;
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") e.target.blur(); });
$("#clr").onclick=()=>{ $("#q").value=""; $("#q").dispatchEvent(new Event("input")); };
$("#chips").innerHTML=CHIPS.map(c=>`<button class="chip">${c}</button>`).join("");
$("#chips").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  $("#q").value=state.q===c.textContent?"":c.textContent; $("#q").dispatchEvent(new Event("input")); $("#q").blur(); window.scrollTo(0,0); });

function counts(id){ let mm=0; CARDS.forEach(c=>{ if(c.m!=="all" && c.m.includes(id)) mm++; }); return [mm,0]; }
function drawPeople(){
  $("#people").innerHTML=PEOPLE.map(p=>`<button data-id="${p.id}" class="${p.id===state.who?"on":""}">${p.id==="all"?"":`<i>${p.id}</i>`}${p.short}</button>`).join("");
}
$("#people").addEventListener("click",e=>{ const b=e.target.closest("button[data-id]"); if(!b) return;
  state.who=b.dataset.id; try{localStorage.setItem("g5qa",JSON.stringify({who:state.who}))}catch(err){} render();
  b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); });

if(!(SHEET_ID && loadLocal())){ CARDS=toCards(EMBED); }
render();
loadSheet();
</script>
</body>
</html>
