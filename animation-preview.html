<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCCU EAP 小助手送件動畫預覽</title>
  <style>
    :root {
      --ink: #173f63;
      --ink-soft: #5d7185;
      --line: #b8d4ea;
      --blue: #2d7db8;
      --blue-soft: #e7f3fc;
      --blue-pale: #f4fbff;
      --purple: #7050a8;
      --purple-soft: #f2ecfb;
      --purple-line: #d1bdf0;
      --green: #1f7f68;
      --green-soft: #e8f7f2;
      --warm: #9c5a16;
      --paper: #ffffff;
      --shadow: 0 22px 58px rgba(23, 63, 99, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(184, 217, 244, 0.76), transparent 28rem),
        radial-gradient(circle at 92% 6%, rgba(226, 214, 250, 0.42), transparent 24rem),
        linear-gradient(180deg, #e7f4fb 0%, #f7fbfe 56%, #ffffff 100%);
    }

    .page {
      width: min(1220px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .preview-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 4.6vw, 62px);
      line-height: 1.12;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: 0;
    }

    .note {
      max-width: 360px;
      color: var(--ink-soft);
      font-size: 20px;
      line-height: 1.45;
      font-weight: 750;
      text-align: right;
    }

    .modal-demo {
      padding: 38px;
      border: 2px solid #a9cce6;
      border-radius: 28px;
      background:
        radial-gradient(circle at 86% 0%, rgba(226, 214, 250, 0.5), transparent 26rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(246, 252, 255, 0.96));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .modal-title {
      margin: 0;
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.08;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: 0;
    }

    .count-chip {
      flex: 0 0 auto;
      min-width: 126px;
      padding: 14px 20px;
      border-radius: 999px;
      color: var(--blue);
      background: #e5f3fc;
      border: 1.5px solid #b7d8ee;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
    }

    .modal-copy {
      margin: 0 0 22px;
      color: var(--ink-soft);
      font-size: 24px;
      line-height: 1.55;
      font-weight: 750;
    }

    .guide-title {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      padding: 10px 18px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid #b8d4ea;
      font-size: 22px;
      font-weight: 900;
    }

    .guide-title::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 0 0 6px rgba(45, 125, 184, 0.1);
    }

    .guide-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .guide-card {
      min-height: 210px;
      padding: 28px 30px;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, #f0f8fe, var(--blue-soft));
      box-shadow: 0 14px 34px rgba(44, 125, 189, 0.08);
    }

    .guide-card.sample {
      border-color: var(--purple-line);
      background: linear-gradient(135deg, #fbf8ff, var(--purple-soft));
      box-shadow: 0 14px 34px rgba(112, 80, 168, 0.08);
    }

    .guide-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 30px;
    }

    .guide-card-title {
      margin: 0;
      color: var(--ink);
      font-size: 30px;
      line-height: 1.18;
      font-weight: 900;
    }

    .guide-pill {
      flex: 0 0 auto;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--blue);
      font-size: 20px;
      font-weight: 900;
    }

    .sample .guide-pill {
      color: var(--purple);
    }

    .guide-card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 23px;
      line-height: 1.65;
      font-weight: 750;
    }

    .delivery-stage {
      position: relative;
      margin: 8px auto 34px;
      width: min(100%, 980px);
      height: 210px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 88% 50%, rgba(31, 127, 104, 0.12), transparent 16rem),
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(236, 248, 255, 0.82));
      overflow: hidden;
    }

    .svg-preview-stage {
      position: relative;
      margin: 8px auto 34px;
      width: min(100%, 860px);
      padding: 16px 18px 20px;
      border-radius: 28px;
      border: 2px solid #b8d4ea;
      background:
        radial-gradient(circle at 84% 14%, rgba(226, 214, 250, 0.42), transparent 20rem),
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(236, 248, 255, 0.86));
      box-shadow: 0 18px 42px rgba(23, 63, 99, 0.1);
    }

    .svg-preview-caption {
      display: inline-flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
      margin: 0 0 12px;
      padding: 12px 20px 12px 44px;
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid #b8d4ea;
      font-weight: 900;
      position: relative;
    }

    .svg-preview-caption::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 18px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 6px rgba(45, 125, 184, 0.12);
    }

    .svg-preview-caption strong {
      color: var(--ink);
      font-size: 22px;
      line-height: 1.15;
    }

    .svg-preview-caption span {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .svg-frame {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #ffffff;
      height: clamp(150px, 20vw, 190px);
    }

    .svg-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 73%;
      filter: saturate(0.94) brightness(1.03);
    }

    .guide-delivery {
      position: relative;
      width: min(760px, 100%);
      height: clamp(246px, 27vw, 284px);
      margin: 0 auto 28px;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(151, 196, 225, 0.62);
      background:
        radial-gradient(circle at 82% 20%, rgba(216, 202, 246, 0.22), transparent 10rem),
        linear-gradient(135deg, rgba(240, 248, 255, 0.84), rgba(251, 248, 255, 0.74));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        0 14px 34px rgba(18, 61, 102, 0.08);
      isolation: isolate;
    }

    .guide-delivery-svg {
      position: absolute;
      inset: 8px 16px auto;
      z-index: 0;
      display: block;
      width: calc(100% - 32px);
      height: 160px;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0.14;
      filter: saturate(0.7) brightness(1.08);
      border-radius: 18px;
    }

    .guide-delivery .guide-cards {
      position: absolute;
      inset: 12px 28px auto;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
    }

    .guide-delivery .guide-card {
      min-height: 104px;
      padding: 16px 18px;
      border-width: 1.5px;
      border-color: rgba(111, 174, 219, 0.55);
      border-radius: 16px;
      background: rgba(239, 248, 255, 0.91);
      box-shadow: 0 10px 22px rgba(23, 63, 99, 0.06);
      backdrop-filter: blur(2px);
    }

    .guide-delivery .guide-card.sample {
      border-color: rgba(166, 139, 223, 0.55);
      background: rgba(247, 242, 255, 0.91);
    }

    .guide-delivery .guide-card-head {
      margin-bottom: 10px;
    }

    .guide-delivery .guide-card-title {
      font-size: 22px;
    }

    .guide-delivery .guide-pill {
      padding: 7px 12px;
      font-size: 15px;
    }

    .guide-delivery .guide-card p {
      font-size: 16px;
      line-height: 1.55;
    }

    .guide-delivery::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 20%;
      bottom: 16px;
      height: 8px;
      border-radius: 999px;
      background: rgba(188, 215, 235, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      z-index: 2;
    }

    .guide-progress-fill {
      position: absolute;
      left: 8%;
      bottom: 16px;
      width: 0;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #72b7dc, #8f8be3);
      z-index: 3;
      animation: guideProgress 5s linear forwards;
    }

    .guide-eap-sign {
      position: absolute;
      right: 5%;
      bottom: 48px;
      z-index: 5;
      min-width: 78px;
      padding: 10px 18px;
      border: 2px solid rgba(137, 112, 212, 0.78);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(249, 247, 255, 0.94));
      color: #5a45a1;
      font-size: 1.15rem;
      font-weight: 850;
      text-align: center;
      box-shadow:
        0 10px 22px rgba(92, 69, 161, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .guide-eap-sign::before {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(100% - 1px);
      width: 8px;
      height: 26px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(180deg, rgba(137, 112, 212, 0.68), rgba(112, 93, 181, 0.78));
      transform: translateX(-50%);
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.5);
    }

    .guide-eap-sign::after {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(100% + 21px);
      width: 42px;
      height: 8px;
      border-radius: 999px;
      background: rgba(115, 98, 171, 0.22);
      transform: translateX(-50%);
      box-shadow: 0 2px 5px rgba(53, 43, 104, 0.08);
    }

    .guide-runner {
      position: absolute;
      left: 8%;
      bottom: 20px;
      z-index: 4;
      width: 124px;
      height: 68px;
      animation: guideRunner 5s linear forwards;
    }

    .guide-cart {
      position: absolute;
      left: 0;
      bottom: 7px;
      width: 54px;
      height: 28px;
      border: 2px solid #734617;
      border-radius: 5px 5px 8px 8px;
      background: linear-gradient(#b87c45, #9f6532);
    }

    .guide-cart::before,
    .guide-cart::after {
      content: "";
      position: absolute;
      top: -24px;
      width: 18px;
      height: 28px;
      border: 1px solid rgba(83, 96, 119, 0.45);
      border-radius: 3px;
      background: linear-gradient(#ffffff, #edf5ff);
      transform: rotate(-3deg);
      box-shadow: inset 0 -8px 0 rgba(127, 181, 218, 0.18);
    }

    .guide-cart::before { left: 9px; }

    .guide-cart::after {
      left: 28px;
      border-color: rgba(137, 112, 212, 0.45);
      background: linear-gradient(#ffffff, #f5efff);
      transform: rotate(4deg);
    }

    .guide-helper {
      position: absolute;
      left: 56px;
      bottom: 0;
      width: 44px;
      height: 62px;
    }

    .guide-helper::after {
      content: "";
      position: absolute;
      left: -2px;
      bottom: 26px;
      z-index: 1;
      width: 16px;
      height: 7px;
      border: 1px solid rgba(183, 121, 88, 0.45);
      border-radius: 999px;
      background: #ffe3cf;
      transform: rotate(-18deg);
    }

    .guide-helper-head {
      position: absolute;
      left: 6px;
      top: 4px;
      width: 34px;
      height: 34px;
      border: 2px solid rgba(104, 67, 42, 0.8);
      border-radius: 50%;
      background: #ffe3cf;
    }

    .guide-helper-head::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 30px;
      height: 17px;
      border-radius: 50% 50% 36% 36%;
      background: #54301f;
    }

    .guide-helper-face {
      position: absolute;
      left: 8px;
      top: 17px;
      width: 18px;
      height: 10px;
      border-radius: 50%;
      border-bottom: 2px solid rgba(64, 47, 45, 0.5);
    }

    .guide-helper-face::before,
    .guide-helper-face::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 6px;
      height: 6px;
      border: 1.5px solid #27394a;
      border-radius: 50%;
      background: #fff;
    }

    .guide-helper-face::before { left: -1px; }
    .guide-helper-face::after { right: -1px; }

    .guide-helper-body {
      position: absolute;
      left: 12px;
      bottom: 2px;
      width: 24px;
      height: 28px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(#294d63, #17364c);
    }

    .guide-helper-body::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      width: 12px;
      height: 10px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: #8bc9df;
    }

    @keyframes guideRunner {
      from { left: 8%; }
      to { left: calc(100% - 250px); }
    }

    @keyframes guideProgress {
      from { width: 0; }
      to { width: 72%; }
    }

    .delivery-caption {
      position: absolute;
      left: 7%;
      top: 30px;
      color: var(--ink-soft);
      font-size: 22px;
      font-weight: 900;
    }

    .track {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 42px;
      height: 18px;
      border-radius: 999px;
      background: #cfe5f5;
      box-shadow: inset 0 0 0 2px rgba(44, 125, 189, 0.13);
      overflow: hidden;
    }

    .track::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #79c4e6, #2d7db8);
      transform-origin: left center;
      animation: fillBar 5s linear infinite;
    }

    .eap-house {
      position: absolute;
      right: 6%;
      bottom: 68px;
      width: 150px;
      height: 108px;
      border: 2px solid #9fd6c7;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #e8f7f2);
      box-shadow: 0 18px 34px rgba(31, 127, 104, 0.16);
    }

    .eap-house::before {
      content: "";
      position: absolute;
      left: 17px;
      right: 17px;
      top: -28px;
      height: 48px;
      border-radius: 14px 14px 8px 8px;
      background: linear-gradient(135deg, #7ccbb7, #1f7f68);
      transform: skewX(-14deg);
      box-shadow: 0 8px 16px rgba(31, 127, 104, 0.13);
    }

    .eap-house span {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      color: var(--green);
      font-size: 28px;
      font-weight: 950;
      text-align: center;
    }

    .arrival-sign {
      position: absolute;
      right: 5.6%;
      bottom: 178px;
      width: 164px;
      padding: 10px 14px;
      border: 2px solid #c9b6ed;
      border-radius: 16px;
      color: var(--purple);
      background: linear-gradient(135deg, #ffffff, #f5efff);
      font-size: 22px;
      font-weight: 950;
      text-align: center;
      box-shadow: 0 12px 24px rgba(112, 80, 168, 0.12);
    }

    .runner {
      position: absolute;
      left: 7%;
      bottom: 44px;
      width: 255px;
      height: 132px;
      animation: deliveryRun 5s ease-in-out infinite;
      z-index: 5;
    }

    .assistant {
      position: absolute;
      left: 0;
      bottom: 20px;
      width: 88px;
      height: 92px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #b7d8ee;
      box-shadow: 0 12px 26px rgba(23, 63, 99, 0.18);
      overflow: hidden;
    }

    .assistant::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 6px;
      width: 68px;
      height: 56px;
      border-radius: 42px 42px 24px 24px;
      background: #6d3e22;
    }

    .assistant-face {
      position: absolute;
      left: 18px;
      top: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffd8c6;
      border: 2px solid #c87d55;
      z-index: 2;
    }

    .assistant-face::before,
    .assistant-face::after {
      content: "";
      position: absolute;
      top: 24px;
      width: 18px;
      height: 14px;
      border: 2px solid #523220;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
    }

    .assistant-face::before {
      left: 8px;
    }

    .assistant-face::after {
      right: 8px;
    }

    .assistant-hair {
      position: absolute;
      left: 19px;
      top: 13px;
      width: 58px;
      height: 30px;
      border-radius: 34px 34px 16px 16px;
      background: #5b321d;
      z-index: 4;
    }

    .assistant-hair::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 18px;
      width: 44px;
      height: 15px;
      border-radius: 0 0 50% 50%;
      background: #5b321d;
      transform: rotate(-4deg);
    }

    .assistant-smile {
      position: absolute;
      left: 37px;
      top: 59px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #8a4731;
      border-radius: 50%;
      z-index: 5;
    }

    .assistant-body {
      position: absolute;
      left: 19px;
      bottom: 0;
      width: 54px;
      height: 30px;
      border-radius: 22px 22px 0 0;
      background: linear-gradient(135deg, #73bee3, #2d7db8);
      z-index: 1;
    }

    .assistant-arm {
      position: absolute;
      left: 72px;
      bottom: 58px;
      width: 48px;
      height: 16px;
      border-radius: 999px;
      background: #ffd8c6;
      border: 2px solid #d99d87;
      transform-origin: left center;
      animation: pushArm 0.9s ease-in-out infinite;
      z-index: 8;
    }

    .cart {
      position: absolute;
      left: 112px;
      bottom: 34px;
      width: 126px;
      height: 68px;
      border: 3px solid #c9b6ed;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 16px 24px rgba(112, 80, 168, 0.14);
    }

    .cart::before,
    .cart::after {
      content: "";
      position: absolute;
      bottom: -14px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #7050a8;
      box-shadow: inset 0 0 0 5px #e4d8f7;
    }

    .cart::before {
      left: 18px;
    }

    .cart::after {
      right: 18px;
    }

    .doc {
      position: absolute;
      width: 84px;
      height: 18px;
      left: 134px;
      border-radius: 999px;
      background: #d7c3f2;
      z-index: 9;
    }

    .doc.one {
      bottom: 82px;
    }

    .doc.two {
      bottom: 62px;
      width: 64px;
    }

    .doc.three {
      bottom: 42px;
      width: 78px;
      background: #b7d8ee;
    }

    .action-button {
      display: block;
      width: min(620px, 100%);
      margin: 0 auto;
      padding: 26px 28px;
      border: 2px solid #9fc2dc;
      border-radius: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, #2d7db8, #1f5d8e);
      box-shadow: 0 18px 34px rgba(31, 93, 142, 0.18);
      font: inherit;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .action-button:disabled {
      cursor: wait;
      color: #5d7185;
      background: #eef5fa;
      box-shadow: none;
      opacity: 1;
    }

    .action-button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px rgba(31, 93, 142, 0.23);
    }

    @keyframes fillBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes deliveryRun {
      0% { left: 7%; transform: translateY(0); }
      44% { left: calc(88% - 255px); transform: translateY(-4px); }
      58% { left: calc(88% - 255px); transform: translateY(0); }
      100% { left: 7%; transform: translateY(0); }
    }

    @keyframes pushArm {
      0%, 100% { transform: rotate(-5deg) translateX(0); }
      50% { transform: rotate(4deg) translateX(8px); }
    }

    @keyframes gentleDelivery {
      0%, 100% { transform: translateX(0) translateY(0); }
      45% { transform: translateX(10px) translateY(-3px); }
      65% { transform: translateX(10px) translateY(0); }
    }

    @media (max-width: 900px) {
      .preview-title,
      .modal-head,
      .guide-cards {
        display: grid;
        grid-template-columns: 1fr;
      }

      .note {
        text-align: left;
      }

      .modal-demo {
        padding: 26px;
      }

      .delivery-stage {
        height: 190px;
      }

      .arrival-sign {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 24px, 1220px);
        padding: 28px 0;
      }

      .guide-card {
        min-height: auto;
      }

      .guide-card-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .runner {
        transform: scale(0.72);
        transform-origin: left bottom;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="preview-title">
      <div>
        <h1>第一次使用小提醒</h1>
      </div>
      <p class="note">這是預計放進口試與學位考試系統的 5 秒說明視窗。</p>
    </section>

    <section class="modal-demo" aria-label="小助手送件動畫預覽">
      <div class="modal-head">
        <h2 class="modal-title">小助手正在努力將文件送過來</h2>
        <div class="count-chip">5 秒後可按</div>
      </div>
      <p class="modal-copy">請先花5秒查看下方操作說明</p>

      <div class="guide-title">表單說明</div>

      <div class="guide-delivery" aria-hidden="true">
        <img class="guide-delivery-svg" src="eap_nccu_v8_terminal.svg" alt="">
        <div class="guide-cards">
          <article class="guide-card">
            <div class="guide-card-head">
              <h3 class="guide-card-title">正式表單</h3>
              <span class="guide-pill">藍色檔案</span>
            </div>
            <p>點擊後會下載到電腦，系統會自動亮燈並往下一步。</p>
          </article>

          <article class="guide-card sample">
            <div class="guide-card-head">
              <h3 class="guide-card-title">示範檔案</h3>
              <span class="guide-pill">紫色範例</span>
            </div>
            <p>可依需要查看；沒有點也可以繼續操作。</p>
          </article>
        </div>
        <div class="guide-progress-fill"></div>
        <div class="guide-runner">
          <div class="guide-cart"></div>
          <div class="guide-helper">
            <div class="guide-helper-head"><span class="guide-helper-face"></span></div>
            <div class="guide-helper-body"></div>
          </div>
        </div>
        <div class="guide-eap-sign">EAP</div>
      </div>

      <button class="action-button" type="button" id="readyButton" disabled>
        我知道了（<span id="count">5</span>）
      </button>
    </section>
  </main>

  <script>
    const button = document.getElementById("readyButton");
    const count = document.getElementById("count");
    const chip = document.querySelector(".count-chip");
    let remaining = 5;

    const timer = window.setInterval(() => {
      remaining -= 1;
      count.textContent = String(Math.max(remaining, 0));
      chip.textContent = remaining > 0 ? `${remaining} 秒後可按` : "可以開始";

      if (remaining <= 0) {
        window.clearInterval(timer);
        button.disabled = false;
        button.textContent = "我知道了";
      }
    }, 1000);
  </script>
</body>
</html>
